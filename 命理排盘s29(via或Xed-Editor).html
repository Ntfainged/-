function onJigongChange() {
  const sel = document.getElementById('jigongSelect');
  if (sel) OPT.jigong = sel.value;

}

// [P0-2] 定局法切换
function onDingjuChange() {
  const sel = document.getElementById('dingjuSelect');

}

// [P1-5] 转盘/飞盘切换
function onPanTypeChange() {
  const sel = document.getElementById('panTypeSelect');
  if (sel) OPT.panType = sel.value;

}

function setNow() {
  const n = new Date();
  document.getElementById('d').value = n.getFullYear() + '-' +
    String(n.getMonth()+1).padStart(2,'0') + '-' +
    String(n.getDate()).padStart(2,'0');
  document.getElementById('t').value =
    String(n.getHours()).padStart(2,'0') + ':' +
    String(n.getMinutes()).padStart(2,'0');
}

function useBeijing() {
  document.getElementById('lng').value = '116.4074';

// ============================================================

function openMapQuery() {
  const place = document.getElementById('placeInput').value.trim();
  const status = document.getElementById('locStatus');
  if (place && navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(place).catch(() => {});
  }
  window.open('https://365-tools.cn/city-level/', '_blank');
  status.textContent = place
    ? `已打开查询页，地名已复制：${place}`
    : '已打开查询页，选省市区即可看经纬度';
}

// ============================================================
// 【区块 02.6】旬空 / 副旬 / 截空 / 副截 / 天伤天使
// ============================================================
const YANG_GAN = ['甲','丙','戊','庚','壬'];
const YANG_ZHI = ['子','寅','辰','午','申','戌'];
const YIN_ZHI  = ['丑','卯','巳','未','酉','亥'];

function calcYinYangKong(yearGan) {
  const isYang = YANG_GAN.includes(yearGan);
  return {
    yangKong:  isYang ? YANG_ZHI.slice() : YIN_ZHI.slice(),
    yinKong:   isYang ? YIN_ZHI.slice()  : YANG_ZHI.slice(),
    isYang
  };
}

const JIE_KONG_TABLE = {
  '甲':['申','酉'], '己':['申','酉'],
  '乙':['午','未'], '庚':['午','未'],
  '丙':['辰','巳'], '辛':['辰','巳'],
  '丁':['寅','卯'], '壬':['寅','卯'],
  '戊':['子','丑'], '癸':['子','丑']
};
function calcJieKong(yearGan) {
  const pair = JIE_KONG_TABLE[yearGan] || ['子','丑'];
  const isYang = YANG_GAN.includes(yearGan);
  const yangBranch = pair.find(z => YANG_ZHI.includes(z)) || pair[0] || '';
  const yinBranch  = pair.find(z => YIN_ZHI.includes(z))  || pair[1] || '';
  return {
    zhengJie: isYang ? yangBranch : yinBranch,
    fuJie:    isYang ? yinBranch  : yangBranch,
    isYang
  };
}

function calcShangShi(yearGan, gender) {
  const isYangYear = YANG_GAN.includes(yearGan);
  const isMale = gender === '男';
  if ((isYangYear && isMale) || (!isYangYear && !isMale)) {
    return { tianShangPalace: '奴仆', tianShiPalace: '疾厄' };
  }
  return { tianShangPalace: '疾厄', tianShiPalace: '奴仆' };
}

// ============================================================
// [插槽 P0-2] 定局法切换
// ------------------------------------------------------------
// 现在 calc() 里用的是硬编码节气表 + 上中下元 → 拆补法
// 要支持置闰、茅山，需要在这里返回 juStr
// ------------------------------------------------------------
// 输入：jqName（节气名）、fuTou（符头干支）、sanyuan（上/中/下元）、OPT.dingju
// 返回：局数字符串（如 '阳遁一局'）
// 参考：
//   拆补法：现有 JU[jqName][syIdx] 逻辑
//   置闰法：需要判断超神接气，节气到符头的天数差 > 9 天需要置闰
//   茅山法：符头配节气，改用月令，规则不同
// ============================================================
// ============================================================
// [P0-2 已实现] 定局法切换：拆补 / 置闰 / 茅山
// ------------------------------------------------------------
// 拆补法：按节气 + 上中下元直接查表（原有逻辑）
// 置闰法：判断超神接气，符头超前节气 > 9 天时置闰
// 茅山法：暂与拆补法相同（待完善）
// ============================================================
function qCalcInsert(jqName, fuTou, sanyuan, method, inputTime) {
  const syIdx = ['上元','中元','下元'].indexOf(sanyuan);
  const chaibuJu = (JU[jqName] && syIdx >= 0) ? JU[jqName][syIdx] : '阳遁一局';

  if (method === 'chaibu' || method === 'maoshan') {
    return chaibuJu;
  }

  if (method === 'zhirun') {
    // ---- 置闰法 ----
    // 1. 找到上一个节气日期
    // 2. 找到该节气的上元符头（最近的甲己日）
    // 3. 计算符头到节气的天数差
    // 4. 若符头超前节气 > 9 天 → 置闰
    try {
      const prevJQ = D.lunar && D.lunar.getPrevJieQi ? D.lunar.getPrevJieQi() : null;
      if (!prevJQ) return chaibuJu;

      const jqSolar = prevJQ.getSolar();
      const jqDate = new Date(
        jqSolar.getYear(), jqSolar.getMonth() - 1, jqSolar.getDay(),
        jqSolar.getHour(), jqSolar.getMinute()
      );
      const nowDate = new Date((inputTime || '').replace(/-/g, '/'));
      const diffDays = (nowDate - jqDate) / (1000 * 60 * 60 * 24);

      // 符头超前节气天数 = 上元符头到现在的天数
      // 简化的置闰判断：如果当前"元"的天数跨度超过 9 天，用下一元
      // 精确实现需要符头日期，这里给一个可用的近似
      if (diffDays > 9 && syIdx !== undefined && syIdx >= 0 && syIdx < 2) {
        // 超神超过 9 天，用下一元
        const nextJu = JU[jqName][(syIdx + 1) % 3];
        if (nextJu) return nextJu;
      }
      return chaibuJu;
    } catch (e) {
      console.warn('置闰法计算失败，回退到拆补法:', e);
      return chaibuJu;
    }
  }

  return chaibuJu;
}

      if (BASHEN_KEYING[gk]) shenKY[p] = BASHEN_KEYING[gk];
    }
  }

  const xunKong = XUNKONG_TABLE[xName.split('(')[0]] || '';
  let yima = '';
  for (const [k, v] of Object.entries(YIMA_TABLE)) {
    if (k.includes(hz)) { yima = v; break; }
  }

  // ---- 暗干 ----
  const anGanMap = getAnGan(dMap, sMap, hg, hz, yang, em, zhiShi);

  // ---- 复用转盘的其它检测函数 ----
  const wuBuYu = checkWuBuYu(dayGan, hg);
  const fuyinFanyin = checkFuYinFanYin(tStar, dMap, STAR, GATE);
  const sanQiGe = checkSanQiGe(tStemMap, dMap, xLoc);
  const jiuDun = checkJiuDun(tStemMap, dMap, sMap, tStar, xLoc);
  const sanZhaWuJia = checkSanZhaWuJia(tStemMap, dMap, sMap, tStar);

  return {
    juStr, yang, diPan: em, tStar, tStemMap, doors: dMap, shen: sMap,
    kongPal, maPal, zhiFu, zhiShi, xunShou: xName, yong, dayGan,
    shiganKY, muMap, xingMap, poMap, xingWang, menWang, menKY,
    shenKY, yueLing, xunKong, yima,
    anGanMap, wuBuYu, fuyinFanyin, sanQiGe, jiuDun, sanZhaWuJia,
    isFeiPan: true  // 标记：这是飞盘
  };
}

// ============================================================
// [插槽 P1-6] 暗干
// ------------------------------------------------------------
// 门暗干（固定口诀）：
//   休门→己，生门→戊，伤门→辛，杜门→庚
//   景门→丙，死门→乙，惊门→壬，开门→丁
// 宫暗干：以值使门落宫为起点，按阳顺阴逆排三奇六仪
// ------------------------------------------------------------
// 输入：doors（8门宫位映射）、shen（8神宫位映射）、
//      hg（时干）、hz（时支）、yang（阴阳遁）、em（地盘干）
// 返回：{ menAnGan: {宫位: 暗干}, gongAnGan: {宫位: 暗干} }
// ============================================================
// ============================================================
// [P1-6 已实现] 暗干
// ------------------------------------------------------------
// 门暗干：固定口诀，随八门落宫确定
// 宫暗干：以值使门落宫为起点，按阳顺阴逆沿八宫排三奇六仪
//        起点宫位 = 值使门所在宫
//        顺序：戊己庚辛壬癸丁丙乙（地盘干的顺序）
//        中宫寄坤二宫
// ------------------------------------------------------------
function getAnGan(doors, shen, hg, hz, yang, em, zhiShi) {
  // ---- 门暗干（固定口诀） ----
  const MEN_ANGAN = {
    '休门':'己','生门':'戊','伤门':'辛','杜门':'庚',
    '景门':'丙','死门':'乙','惊门':'壬','开门':'丁'
  };
  const menAnGan = {};
  for (let p = 1; p <= 9; p++) {
    const d = doors[p];
    if (d && MEN_ANGAN[d]) menAnGan[p] = MEN_ANGAN[d];
  }

  // ---- 宫暗干 ----
  // 找值使门落宫（zhiShi 是门名，如 '休门'）
  const gongAnGan = {};
  if (zhiShi) {
    const ring = [1, 8, 3, 4, 9, 2, 7, 6];  // 八宫顺时针（洛书）
    const SEQ = ['戊','己','庚','辛','壬','癸','丁','丙','乙'];
    // 找值使门所在宫（八宫范围内）
    let startRingIdx = 0;
    for (let i = 0; i < ring.length; i++) {
      if (doors[ring[i]] === zhiShi) { startRingIdx = i; break; }
    }
    // 从值使门落宫开始，按阳顺阴逆排三奇六仪
    for (let i = 0; i < ring.length; i++) {
      const idx = yang ? (startRingIdx + i) % 8 : ((startRingIdx - i) % 8 + 8) % 8;
      const pal = ring[idx];
      gongAnGan[pal] = SEQ[i % 9];
    }
    // 中宫暗干寄坤二宫（如果坤宫没有，则用中宫自己的地盘干）
    if (!gongAnGan[5] && em[5]) gongAnGan[5] = em[5];
  }

  return { menAnGan, gongAnGan };
}

// ============================================================
// [插槽 P2-7] 五不遇时
// ------------------------------------------------------------
// 规则：时干克日干，且时干日干同阴阳
// 主百事不顺
// ------------------------------------------------------------
// 输入：dayGan, hourGan
// 返回：true / false
// ============================================================
function checkWuBuYu(dayGan, hourGan) {
  if (!dayGan || !hourGan) return false;
  const dw = WX_GAN[dayGan], hw = WX_GAN[hourGan];
  if (!dw || !hw) return false;
  const sameYY = (TG.indexOf(dayGan) % 2) === (TG.indexOf(hourGan) % 2);
  return sameYY && WX_KE[hw] === dw;
}

// ============================================================
// [插槽 P2-8] 伏吟 / 反吟
// ------------------------------------------------------------
// 星伏吟：天盘星回到本宫（tStar[p] === stars[p]）
// 门伏吟：天盘门回到本宫（dMap[p] === gates[p]）
// 星反吟：天盘星落在对宫
// 门反吟：天盘门落在对宫
// ------------------------------------------------------------
// 输入：tStar（天盘星）、doors（天盘门）、stars（原始星）、gates（原始门）
// 返回：{ starFu:[], doorFu:[], starFan:[], doorFan:[] }
// ============================================================
// ============================================================
// [P2-8 已实现] 伏吟 / 反吟
// ------------------------------------------------------------
// 对宫映射（洛书）：1↔9、2↔8、3↔7、4↔6
// 星伏吟：整个天盘星落回地盘原位
// 门伏吟：整个天盘门落回地盘原位
// 星反吟：整个天盘星落在对宫
// 门反吟：整个天盘门落在对宫
// 返回：{ starFu:[], doorFu:[], starFan:[], doorFan:[] }
// 数组非空表示伏吟/反吟成立，元素为宫位号（顺时针顺序）
// ============================================================
function checkFuYinFanYin(tStar, doors, stars, gates) {
  const OPPOSITE = {1:9, 9:1, 2:8, 8:2, 3:7, 7:3, 4:6, 6:4};
  const ring = [1, 8, 3, 4, 9, 2, 7, 6];  // 八宫顺时针
  const result = { starFu:[], doorFu:[], starFan:[], doorFan:[] };

  // 匹配辅助（处理 '天芮/天禽' 这种双星）
  const starMatch = (a, b) => {
    if (!a || !b) return false;
    if (a === b) return true;
    return a.split('/').includes(b);
  };

  // ---- 星伏吟：所有宫位天盘星 === 地盘星 ----
  let allStarFu = true;
  for (const p of ring) {
    if (!starMatch(tStar[p], stars[p])) { allStarFu = false; break; }
  }
  if (allStarFu) result.starFu = ring.slice();

  // ---- 门伏吟：所有宫位天盘门 === 地盘门 ----
  let allDoorFu = true;
  for (const p of ring) {
    if (!doors[p] || !gates[p] || doors[p] !== gates[p]) { allDoorFu = false; break; }
  }
  if (allDoorFu) result.doorFu = ring.slice();

  // ---- 星反吟：所有宫位天盘星落在对宫 ----
  let allStarFan = true;
  for (const p of ring) {
    const opp = OPPOSITE[p];
    if (!starMatch(tStar[opp], stars[p])) { allStarFan = false; break; }
  }
  if (allStarFan) result.starFan = ring.slice();

  // ---- 门反吟：所有宫位天盘门落在对宫 ----
  let allDoorFan = true;
  for (const p of ring) {
    const opp = OPPOSITE[p];
    if (!doors[opp] || !gates[p] || doors[opp] !== gates[p]) { allDoorFan = false; break; }
  }
  if (allDoorFan) result.doorFan = ring.slice();

  return result;
}

// ============================================================
// [插槽 P2-9] 三奇得使 / 玉女守门 / 三奇升殿
// ------------------------------------------------------------
// 三奇得使：
//   天盘乙 + 地盘开门 / 天盘丙 + 地盘休门 / 天盘丁 + 地盘生门
// 玉女守门：
//   天盘丁奇 + 地盘值使门同宫
// 三奇升殿：
//   乙到震三宫 / 丙到离九宫 / 丁到兑七宫
// ------------------------------------------------------------
// 输入：tStemMap（天盘干）、doors（天盘门）、xLoc（值使门原始宫）
// 返回：{ deShi:[], yuNv:[], shengDian:[] }，每项为宫位数组
// ============================================================
// ============================================================
// [P2-9 已实现] 三奇得使 / 玉女守门 / 三奇升殿
// ------------------------------------------------------------
// 三奇得使：天盘三奇 + 天盘三吉门同宫
//   乙 + 开门，丙 + 休门，丁 + 生门
// 玉女守门：天盘丁奇 + 地盘值使门同宫
// 三奇升殿：三奇落回本宫（震/离/兑）
//   乙到震3宫，丙到离9宫，丁到兑7宫
// ------------------------------------------------------------
// 输入：tStemMap（天盘干映射）、dMap（天盘门映射）、xLoc（值符/值使原始宫）
// 返回：{ deShi:[宫位], yuNv:[宫位], shengDian:[宫位] }
// ============================================================
function checkSanQiGe(tStemMap, dMap, xLoc) {
  const ring = [1, 8, 3, 4, 9, 2, 7, 6];
  const result = { deShi: [], yuNv: [], shengDian: [] };

  // ---- 1. 三奇得使 ----
  const DE_SHI = [
    { qi: '乙', door: '开门' },
    { qi: '丙', door: '休门' },
    { qi: '丁', door: '生门' }
  ];
  for (const p of ring) {
    const stems = tStemMap[p] || [];
    const door = dMap[p] || '';
    for (const pair of DE_SHI) {
      if (stems.includes(pair.qi) && door === pair.door) {
        if (!result.deShi.includes(p)) result.deShi.push(p);
      }
    }
  }

  // ---- 2. 玉女守门 ----
// 天盘丁奇 + 地盘值使门同宫（中宫寄坤/艮）
{
  const target = (xLoc === 5) ? getJiGong() : xLoc;
  const stems = tStemMap[target] || [];
  if (stems.includes('丁')) result.yuNv.push(target);
}

  // ---- 3. 三奇升殿 ----
  const SHENG_DIAN = [
    { qi: '乙', palace: 3 },  // 震3宫
    { qi: '丙', palace: 9 },  // 离9宫
    { qi: '丁', palace: 7 }   // 兑7宫
  ];
  for (const item of SHENG_DIAN) {
    const stems = tStemMap[item.palace] || [];
    if (stems.includes(item.qi)) {
      result.shengDian.push(item.palace);
    }
  }

  return result;
}

// ============================================================
// [插槽 P3-11] 九遁
// ------------------------------------------------------------
// 天遁：生门 + 丙 + 丁
// 地遁：开门 + 乙 + 己
// 人遁：休门 + 丁 + 太阴
// 神遁：生门 + 丙 + 九天
// 鬼遁：杜门 + 丁 + 九地
// 龙遁：开门 + 乙 + 坎宫
// 虎遁：开门 + 辛 + 艮宫
// 风遁：休门 + 乙 + 巽宫
// 云遁：生门 + 乙 + 坤宫
// ------------------------------------------------------------
// 输入：tStemMap, doors, shen, tStar, xLoc
// 返回：{ tianDun:[宫位], diDun:[宫位], ... }
// ============================================================
// ============================================================
// [P3-11 已实现] 九遁
// ------------------------------------------------------------
// 天遁：生门 + 天盘丙 + 天盘丁
// 地遁：开门 + 天盘乙 + 天盘己
// 人遁：休门 + 天盘丁 + 太阴神
// 神遁：生门 + 天盘丙 + 九天
// 鬼遁：杜门 + 天盘丁 + 九地
// 龙遁：开门 + 天盘乙 + 落坎一宫
// 虎遁：开门 + 天盘辛 + 落艮八宫
// 风遁：休门 + 天盘乙 + 落巽四宫
// 云遁：生门 + 天盘乙 + 落坤二宫
// ------------------------------------------------------------
// 返回：{ 天遁:[宫位], 地遁:[宫位], ... }
// ============================================================
function checkJiuDun(tStemMap, doors, shen, tStar, xLoc) {
  const result = {};
  const ring = [1, 8, 3, 4, 9, 2, 7, 6];

  const hit = (name, palace) => {
    if (!result[name]) result[name] = [];
    if (!result[name].includes(palace)) result[name].push(palace);
  };

  for (const p of ring) {
    const stems = tStemMap[p] || [];
    const door = doors[p] || '';
    const god = shen[p] || '';

    // 天遁：生门 + 丙 + 丁
    if (door === '生门' && stems.includes('丙') && stems.includes('丁')) hit('天遁', p);

    // 地遁：开门 + 乙 + 己
    if (door === '开门' && stems.includes('乙') && stems.includes('己')) hit('地遁', p);

    // 人遁：休门 + 丁 + 太阴
    if (door === '休门' && stems.includes('丁') && god === '太阴') hit('人遁', p);

    // 神遁：生门 + 丙 + 九天
    if (door === '生门' && stems.includes('丙') && god === '九天') hit('神遁', p);

    // 鬼遁：杜门 + 丁 + 九地
    if (door === '杜门' && stems.includes('丁') && god === '九地') hit('鬼遁', p);

    // 龙遁：开门 + 乙 + 坎一宫
    if (door === '开门' && stems.includes('乙') && p === 1) hit('龙遁', p);

    // 虎遁：开门 + 辛 + 艮八宫
    if (door === '开门' && stems.includes('辛') && p === 8) hit('虎遁', p);

    // 风遁：休门 + 乙 + 巽四宫
    if (door === '休门' && stems.includes('乙') && p === 4) hit('风遁', p);

    // 云遁：生门 + 乙 + 坤二宫
    if (door === '生门' && stems.includes('乙') && p === 2) hit('云遁', p);
  }

  return result;
}

// ============================================================
// [插槽 P3-12] 三诈五假
// ------------------------------------------------------------
// 三诈：真诈、休诈、重诈
// 五假：天假、地假、人假、神假、鬼假
// ------------------------------------------------------------
// ============================================================
// [P3-12 已实现] 三诈五假
// ------------------------------------------------------------
// 三诈（三奇 + 三吉门 + 特定八神）：
//   真诈：三奇 + 开/休/生 + 太阴
//   休诈：三奇 + 开/休/生 + 六合
//   重诈：三奇 + 开/休/生 + 九地
// 五假：
//   天假：景门 + 三奇 + 九天
//   地假：杜门 + 丁/己/癸 + 九地
//   人假：惊门 + 壬 + 九天
//   神假：伤门 + 丁 + 九地
//   鬼假：死门 + 丁 + 九地
// ------------------------------------------------------------
// 返回：{ 真诈:[宫位], 休诈:[宫位], ... }
// ============================================================
function checkSanZhaWuJia(tStemMap, doors, shen, tStar) {
  const result = {};
  const ring = [1, 8, 3, 4, 9, 2, 7, 6];
  const SANQI = ['乙', '丙', '丁'];
  const JIMEN = ['开门', '休门', '生门'];

  const hit = (name, palace) => {
    if (!result[name]) result[name] = [];
    if (!result[name].includes(palace)) result[name].push(palace);
  };

  for (const p of ring) {
    const stems = tStemMap[p] || [];
    const door = doors[p] || '';
    const god = shen[p] || '';

    const hasSanQi = stems.some(s => SANQI.includes(s));
    const hasJiMen = JIMEN.includes(door);

    // 三诈
    if (hasSanQi && hasJiMen && god === '太阴') hit('真诈', p);
    if (hasSanQi && hasJiMen && god === '六合') hit('休诈', p);
    if (hasSanQi && hasJiMen && god === '九地') hit('重诈', p);

    // 五假
    if (door === '景门' && hasSanQi && god === '九天') hit('天假', p);
    if (door === '杜门' && stems.some(s => ['丁','己','癸'].includes(s)) && god === '九地') hit('地假', p);
    if (door === '惊门' && stems.includes('壬') && god === '九天') hit('人假', p);
    if (door === '伤门' && stems.includes('丁') && god === '九地') hit('神假', p);
    if (door === '死门' && stems.includes('丁') && god === '九地') hit('鬼假', p);
  }

  return result;
}

// ============================================================
// 【区块 05】真太阳时
// ============================================================
function getTrueSolarTime(date, lat, lng) {
  try {
    const times = SunCalc.getTimes(date, lat, lng);
    const solarNoon = times.solarNoon;
    const noonMinutes = solarNoon.getHours()*60 + solarNoon.getMinutes() + solarNoon.getSeconds()/60;
    const noonOffset = noonMinutes - 12*60;
    return new Date(date.getTime() - noonOffset*60*1000);
  } catch(e) {
    const offsetMin = (lng - 120) * 4;
    return new Date(date.getTime() + offsetMin*60*1000);
  }
}

      const syIdx = ['上元','中元','下元'].indexOf(sanyuan);
      if (JU[jqName] && syIdx >= 0) juStr = JU[jqName][syIdx];
      else juStr = '阳遁一局';
    }

    D.yinYangKong = calcYinYangKong(yg);
    D.jieKong = calcJieKong(yg);

    // ============================================================
    // [插槽 P1-5] 飞盘/转盘切换
    // ============================================================
    if (OPT.panType === 'fei') {
      D.qmFei = qCalcFei(hg, hz, juStr, dg);
      D.qm = D.qmFei || qCalc(hg, hz, juStr, dg);
    } else {
      D.qm = qCalc(hg, hz, juStr, dg);
    }
    D.qm.jqName = jqName;
    D.qm.sanyuan = sanyuan;

    const gender = document.querySelector('input[name="g"]:checked').value;
    D.gender = gender;
    D.shangShi = calcShangShi(yg, gender);

    const timeIdx = getTimeIndex(cH);
    const calcDateStr = `${cY}-${String(cM).padStart(2,'0')}-${String(cD).padStart(2,'0')}`;
    const astrolabe = callIztro(calcDateStr, timeIdx, gender);
    if(!astrolabe || !astrolabe.palaces) throw new Error('iztro 返回异常');
    D.zw = astrolabe;

    // ============================================================
    // [插槽 P0-1] 大限/流年四化 + 流耀
    // ============================================================
    // D.horoscope 稍后调用（等 D.lifa 就绪后再算）

    // ============================================================
    // [插槽 P0-3] 自化检测
    // ============================================================
    D.ziHuaMap = checkZiHua(astrolabe);

    // ============================================================
    // [插槽 P1-4] 紫微格局自动检测
    // ============================================================
    D.ziweiPatterns = checkZiWeiPattern(astrolabe);

    // ============================================================
    // [插槽 P2-10] 来因宫
    // ============================================================
    D.laiYinPalace = getLaiYinPalace(astrolabe, yg);

    D.lifa = {
      inputTime: `${Y}-${String(Mo).padStart(2,'0')}-${String(Dd).padStart(2,'0')} ${String(H).padStart(2,'0')}:${String(Mi).padStart(2,'0')}`,
      calcTime: `${cY}-${String(cM).padStart(2,'0')}-${String(cD).padStart(2,'0')} ${String(cH).padStart(2,'0')}:${String(cMi).padStart(2,'0')}`,
      useTST, lng, lat,
      lunarDate: lunar.toString(),
      lunarYear: lunar.getYearInGanZhi() + '年',
      lunarMonth: lunar.getMonthInChinese() + '月',
      lunarDay: lunar.getDayInChinese(),
      yearPillar: yg + yz,
      monthPillar: mg + mz,
      dayPillar: dg + dz,
      hourPillar: hg + hz,
      tenGods,
      fuTou: fuTou.ganZhi,
      sanyuan,
      jqName,
      prevJQTime, nextJQTime,
      juStr
    };

    D.bazi = buildBaziData(ec, gender);

// ============================================================
// [插槽 P0-1] 大限/流年四化 + 流耀（必须在 D.lifa 之后）
// ============================================================
D.horoscope = applyHoroscope(astrolabe, new Date(cY, cM-1, cD));

    renderLifa();
    render();
  } catch(e) {
    console.error(e);
    errOut('排盘失败：' + (e.message || e));
  }
}

// ============================================================
// [插槽 P0-1] 紫微：大限/流年四化 + 流耀
// ------------------------------------------------------------
// iztro 的 astrolabe.horoscope(date) 返回：
//   {
//     decadal: { index, heavenlyStem, earthlyBranch, palaceNames,
//                mutagen, stars, ... },
//     yearly: { ... },
//     monthly: { ... },
//     daily: { ... },
//     hourly: { ... }
//   }
// ------------------------------------------------------------
// 输入：astrolabe、目标日期 Date 对象
// 返回：horoscope 对象，或 null
// 调用位置：calc() 里的 D.horoscope = applyHoroscope(...)
// ============================================================
// ============================================================
// [P0-1 本地版] 大限/流年四化 + 流耀 —— 完全本地计算
// 不调用任何 API，只用固定表格 + 干支推算
// ============================================================

// ---- 十天干四化表（生年/大限/流年通用） ----
const TIAN_GAN_SIHUA = {
  '甲': { 禄:'廉贞', 权:'破军', 科:'武曲', 忌:'太阳' },
  '乙': { 禄:'天机', 权:'天梁', 科:'紫微', 忌:'太阴' },
  '丙': { 禄:'天同', 权:'天机', 科:'文昌', 忌:'廉贞' },
  '丁': { 禄:'太阴', 权:'天同', 科:'天机', 忌:'巨门' },
  '戊': { 禄:'贪狼', 权:'太阴', 科:'右弼', 忌:'天机' },
  '己': { 禄:'武曲', 权:'贪狼', 科:'天梁', 忌:'文曲' },
  '庚': { 禄:'太阳', 权:'武曲', 科:'太阴', 忌:'天同' },

  '癸': { 禄:'破军', 权:'巨门', 科:'太阴', 忌:'贪狼' }
};

// ---- 流昌流曲（按年干） ----
const LIU_CHANG_QU = {
  '甲':{昌:'巳',曲:'酉'}, '乙':{昌:'午',曲:'申'},
  '丙':{昌:'申',曲:'午'}, '丁':{昌:'酉',曲:'巳'},
  '戊':{昌:'申',曲:'午'}, '己':{昌:'酉',曲:'巳'},
  '庚':{昌:'亥',曲:'卯'}, '辛':{昌:'子',曲:'寅'},
  '壬':{昌:'寅',曲:'子'}, '癸':{昌:'卯',曲:'亥'}
};

// ---- 流魁流钺（按年干） ----
const LIU_KUI_YUE = {
  '甲':{魁:'丑',钺:'未'}, '戊':{魁:'丑',钺:'未'}, '庚':{魁:'丑',钺:'未'},
  '乙':{魁:'子',钺:'申'}, '己':{魁:'子',钺:'申'},

  '壬':{魁:'卯',钺:'巳'}, '癸':{魁:'卯',钺:'巳'}
};

// ---- 流马（按年支） ----
const LIU_MA_BY_ZHI = {
  '申':'寅','子':'寅','辰':'寅',
  '寅':'申','午':'申','戌':'申',
  '巳':'亥','酉':'亥','丑':'亥',

};

// ---- 流禄（按年干） ----
const LIU_LU_BY_GAN = {
  '甲':'寅','乙':'卯','丙':'巳','丁':'午','戊':'巳',
  '己':'午','庚':'申','辛':'酉','壬':'亥','癸':'子'
};

// ---- 大限起运岁数（按五行局） ----
const QI_YUN_AGE = {
  '水二局': 2, '木三局': 3, '金四局': 4, '土五局': 5, '火六局': 6
};

// ---- 地支顺序 ----
const ZHI_ORDER_LOCAL = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];

// ============================================================
// [P0-1 本地版] 计算大限 / 流年
// ============================================================
function applyHoroscope(astrolabe, targetDate) {
  if (!astrolabe || !astrolabe.palaces) return null;
  try {
    return computeHoroscopeLocal(astrolabe, targetDate);
  } catch (e) {
    console.warn('本地运限计算失败:', e);
    return null;
  }
}

function computeHoroscopeLocal(astrolabe, targetDate) {
  const targetYear = targetDate.getFullYear();
  const baseYear = 1984;
  const offset = (targetYear - baseYear + 6000) % 60;
  const yearGan = TG[offset % 10];
  const yearZhi = DZ[offset % 12];

  const gender = D.gender;
  const birthYearGan = D.lifa.yearPillar ? D.lifa.yearPillar[0] : '甲';
  const isYangYear = YANG_GAN.includes(birthYearGan);
  const isMale = gender === '男';
  const isForward = (isYangYear && isMale) || (!isYangYear && !isMale);

  const wuxingJu = astrolabe.fiveElementsClass || '水二局';
  const startAge = QI_YUN_AGE[wuxingJu] || 2;

  const birthYear = parseInt((D.lifa.inputTime || '').slice(0, 4)) ||
                    parseInt((astrolabe.solarDate || '').slice(0, 4)) || 2000;
  const age = targetYear - birthYear + 1;

  const palaceByName = {};
  (astrolabe.palaces || []).forEach((p, idx) => {
    palaceByName[p.name] = { palace: p, idx };
  });
  const mingIdx = palaceByName['命宫'] ? palaceByName['命宫'].idx : 0;

  let decadalIndex = 0;
  if (age >= startAge) {
    decadalIndex = Math.floor((age - startAge) / 10);
  }
  let decadalPalaceIdx;
  if (isForward) {
    decadalPalaceIdx = (mingIdx + decadalIndex) % 12;
  } else {
    decadalPalaceIdx = (mingIdx - decadalIndex + 120) % 12;
  }
  const decadalPalace = astrolabe.palaces[decadalPalaceIdx];
  const decadalGan = decadalPalace.heavenlyStem || '甲';

  let yearlyPalaceIdx = -1;
  (astrolabe.palaces || []).forEach((p, idx) => {
    if (p.earthlyBranch === yearZhi) yearlyPalaceIdx = idx;
  });
  if (yearlyPalaceIdx < 0) yearlyPalaceIdx = 0;

  const decadalSiHua = TIAN_GAN_SIHUA[decadalGan] || {};
  const yearlySiHua = TIAN_GAN_SIHUA[yearGan] || {};

  const liuChangQu = LIU_CHANG_QU[yearGan] || {};
  const liuKuiYue = LIU_KUI_YUE[yearGan] || {};
  const liuMa = LIU_MA_BY_ZHI[yearZhi] || '';
  const liuLu = LIU_LU_BY_GAN[yearGan] || '';
  const luIdx = ZHI_ORDER_LOCAL.indexOf(liuLu);
  const liuYang = luIdx >= 0 ? ZHI_ORDER_LOCAL[(luIdx + 1) % 12] : '';
  const liuTuo = luIdx >= 0 ? ZHI_ORDER_LOCAL[(luIdx - 1 + 12) % 12] : '';

  const liuyao = {};
  if (liuChangQu.昌) liuyao['流昌'] = liuChangQu.昌;
  if (liuChangQu.曲) liuyao['流曲'] = liuChangQu.曲;
  if (liuKuiYue.魁) liuyao['流魁'] = liuKuiYue.魁;
  if (liuKuiYue.钺) liuyao['流钺'] = liuKuiYue.钺;
  if (liuMa) liuyao['流马'] = liuMa;
  if (liuLu) liuyao['流禄'] = liuLu;
  if (liuYang) liuyao['流羊'] = liuYang;
  if (liuTuo) liuyao['流陀'] = liuTuo;

  return {
    targetYear,
    age,
    decadal: {
      index: decadalIndex,
      heavenlyStem: decadalGan,
      earthlyBranch: decadalPalace.earthlyBranch || '',
      siHua: decadalSiHua,
      palaceIndex: decadalPalaceIdx
    },
    yearly: {
      index: targetYear,
      heavenlyStem: yearGan,
      earthlyBranch: yearZhi,
      siHua: yearlySiHua,
      palaceIndex: yearlyPalaceIdx
    },
    liuyao
  };
}

// ============================================================
// [插槽 P0-3] 紫微：自化检测
// ------------------------------------------------------------
// 飞星派核心。当宫干四化引发本宫星曜的四化时，即为自化。
// iztro 的 palace 对象有 heavenlyStem 字段（宫干）。
// 需要一张宫干四化表（与生年四化同表）。
// ------------------------------------------------------------
// 输入：astrolabe
// 返回：{ [宫位名]: { lu: [星], quan: [星], ke: [星], ji: [星] } }
// ============================================================
// ============================================================
// [P0-3 已实现] 紫微：自化检测
// ------------------------------------------------------------
// 自化：当宫干四化引发的星曜落在【本宫】时，即为自化。
//   例：某宫宫干是甲 → 甲干四化是廉贞禄、破军权、武曲科、太阳忌
//   如果该宫里有廉贞星，则此宫有「廉贞自化禄」
//   如果该宫里有破军星，则此宫有「破军自化权」
//   以此类推
// ------------------------------------------------------------
// 输入：astrolabe
// 返回：{ [宫位名]: { 禄:[星名...], 权:[星名...], 科:[星名...], 忌:[星名...] } }
// ============================================================
function checkZiHua(astrolabe) {
  if (!astrolabe || !astrolabe.palaces) return {};
  const result = {};
  const SIHUA_MAP = {
    '禄': '禄', '权': '权', '科': '科', '忌': '忌'
  };

  (astrolabe.palaces || []).forEach(p => {
    const palaceName = p.name;
    const palaceGan = p.heavenlyStem;
    if (!palaceName || !palaceGan) return;

    const sihua = TIAN_GAN_SIHUA[palaceGan];
    if (!sihua) return;

    // 本宫所有星曜（主星+辅星+杂曜）
    const allStars = [
      ...(p.majorStars || []),
      ...(p.minorStars || []),
      ...(p.adjectiveStars || [])
    ];
    const starNames = allStars.map(s => s.name);

    const hit = {};
    ['禄', '权', '科', '忌'].forEach(type => {
      const targetStar = sihua[type];
      if (targetStar && starNames.includes(targetStar)) {
        if (!hit[type]) hit[type] = [];
        hit[type].push(targetStar);
      }
    });

    if (Object.keys(hit).length > 0) {
      result[palaceName] = hit;
    }
  });

  return result;
}

// ============================================================
// [插槽 P1-4] 紫微：格局自动检测
// ------------------------------------------------------------
// 常见格局约 40 个，每个都是固定星曜组合的匹配。
// 例：紫府同宫格 = 命宫同时有紫微和天府
//    火贪格 = 火星与贪狼同宫（三合派）
// ------------------------------------------------------------
// 输入：astrolabe
// 返回：[{ name:'紫府同宫格', palace:'命宫', desc:'...' }, ...]
// ============================================================
// ============================================================
// [P1-4 已实现] 紫微格局自动检测
// ------------------------------------------------------------
// 检测约 25 个常见三合派格局，包括吉格和凶格。
// 返回 [{ name, palace, desc, type }]，type 为 '吉' 或 '凶'
// ============================================================
function checkZiWeiPattern(astrolabe) {
  if (!astrolabe || !astrolabe.palaces) return [];
  const results = [];

  // ---- 索引 ----
  const idxByName = {};
  (astrolabe.palaces || []).forEach((p, idx) => {
    idxByName[p.name] = idx;
  });

  const getStars = (p) => p
    ? [...(p.majorStars||[]), ...(p.minorStars||[]), ...(p.adjectiveStars||[])].map(s => s.name)
    : [];
  const hasStar = (p, star) => getStars(p).includes(star);
  const hasMutagen = (p, mut) => {
    if (!p) return false;
    return [...(p.majorStars||[]), ...(p.minorStars||[])]
      .some(s => s.mutagen === mut);
  };

  // 三方四正
  const SANHE = { 0:8, 1:9, 2:10, 3:11, 4:0, 5:1, 6:2, 7:3, 8:4, 9:5, 10:6, 11:7 };
  const DUI = { 0:6, 6:0, 1:7, 7:1, 2:8, 8:2, 3:9, 9:3, 4:10, 10:4, 5:11, 11:5 };
  const getSanFang = (idx) => {
    const i1 = SANHE[idx];
    const i2 = SANHE[i1];
    const i3 = DUI[idx];
    return [astrolabe.palaces[idx], astrolabe.palaces[i1], astrolabe.palaces[i2], astrolabe.palaces[i3]].filter(Boolean);
  };
  const sanFangStars = (idx) => {
    const set = new Set();
    getSanFang(idx).forEach(p => getStars(p).forEach(s => set.add(s)));
    return set;
  };
  const sanFangHas = (idx, star) => sanFangStars(idx).has(star);

  const mingIdx = idxByName['命宫'];
  if (mingIdx === undefined) return [];
  const ming = astrolabe.palaces[mingIdx];
  const mingStars = getStars(ming);
  const mingBranch = ming.earthlyBranch;
  const sanFang = sanFangStars(mingIdx);

  // ---- 吉格 ----

  if (mingStars.includes('紫微') && mingStars.includes('天府')) {
    results.push({ name:'紫府同宫格', palace:'命宫', type:'吉', desc:'紫微天府同宫命宫，主尊贵权威' });
  }
  if (sanFang.has('紫微') && sanFang.has('天府') && !(mingStars.includes('紫微') && mingStars.includes('天府'))) {
    results.push({ name:'紫府朝垣格', palace:'命宫', type:'吉', desc:'紫微天府拱照命宫，主贵' });
  }
  if (mingStars.includes('紫微') && (mingStars.includes('左辅') || mingStars.includes('右弼'))) {
    results.push({ name:'君臣庆会格', palace:'命宫', type:'吉', desc:'紫微遇辅弼，得贤臣辅佐' });
  }
  if (sanFang.has('天府') && sanFang.has('天相')) {
    results.push({ name:'府相朝垣格', palace:'命宫', type:'吉', desc:'天府天相拱照，主衣食无忧' });
  }
  if (sanFang.has('天机') && sanFang.has('太阴') && sanFang.has('天同') && sanFang.has('天梁')) {
    results.push({ name:'机月同梁格', palace:'命宫', type:'吉', desc:'适合稳定公职、从政' });
  }
  if (mingStars.includes('火星') && mingStars.includes('贪狼')) {
      results.push({ name:'火贪同宫格', palace:'命宫', type:'吉', desc:'火星贪狼同宫，爆发力强' });
} else if (sanFang.has('火星') && sanFang.has('贪狼')) {
  results.push({ name:'火贪会照格', palace:'命宫', type:'吉', desc:'火星贪狼三方会照' });
  }
  if (mingStars.includes('铃星') && mingStars.includes('贪狼')) {
      results.push({ name:'铃贪同宫格', palace:'命宫', type:'吉', desc:'铃星贪狼同宫，爆发力强' });
} else if (sanFang.has('铃星') && sanFang.has('贪狼')) {
  results.push({ name:'铃贪会照格', palace:'命宫', type:'吉', desc:'铃星贪狼三方会照' });
  }
  if (sanFang.has('禄存') && sanFang.has('天马')) {
    results.push({ name:'禄马交驰格', palace:'命宫', type:'吉', desc:'财禄动中求，宜外出' });
  }
  {
    let hasLu=false, hasQuan=false, hasKe=false;
    getSanFang(mingIdx).forEach(p => {
      if (hasMutagen(p,'禄')) hasLu = true;
      if (hasMutagen(p,'权')) hasQuan = true;
      if (hasMutagen(p,'科')) hasKe = true;
    });
    if (hasLu && hasQuan && hasKe) {
      results.push({ name:'三奇加会格', palace:'命宫', type:'吉', desc:'禄权科三化会照，一生顺遂' });
    }
  }
  if (mingStars.includes('文昌') && mingStars.includes('文曲')) {
    results.push({ name:'文桂文华格', palace:'命宫', type:'吉', desc:'昌曲同宫，文采风流' });
  }
  if (sanFang.has('太阳') && sanFang.has('太阴')) {
    results.push({ name:'日月并明格', palace:'命宫', type:'吉', desc:'日月拱照，光明磊落' });
  }
  if (mingStars.includes('巨门') && mingStars.includes('太阳')) {
    results.push({ name:'巨日同宫格', palace:'命宫', type:'吉', desc:'巨日同宫，宜口才工作' });
  }
  if (mingStars.includes('武曲') && (mingBranch === '辰' || mingBranch === '戌')) {
    results.push({ name:'武曲守垣格', palace:'命宫', type:'吉', desc:'武曲在辰戌，主财禄丰足' });
  }
  if (mingStars.includes('七杀') && ['寅','申','子','午'].includes(mingBranch)) {
    results.push({ name:'七杀朝斗格', palace:'命宫', type:'吉', desc:'七杀在四正位，主威权' });
  }
  if (mingStars.includes('贪狼') && mingBranch === '寅' && mingStars.length === 1) {
    results.push({ name:'雄宿乾元格', palace:'命宫', type:'吉', desc:'贪狼独坐寅宫，主贵' });
  }
  if (mingStars.includes('巨门') && (mingBranch === '子' || mingBranch === '午')) {
    results.push({ name:'石中隐玉格', palace:'命宫', type:'吉', desc:'巨门在子午，主贵' });
  }

  // ---- 凶格 ----

  {
    const leftIdx = (mingIdx - 1 + 12) % 12;
    const rightIdx = (mingIdx + 1) % 12;
    const lStars = getStars(astrolabe.palaces[leftIdx]);
    const rStars = getStars(astrolabe.palaces[rightIdx]);
    const hasKong = (lStars.includes('地空') && rStars.includes('地劫')) ||
                    (lStars.includes('地劫') && rStars.includes('地空'));
    if (hasKong) {
      results.push({ name:'空劫夹命格', palace:'命宫', type:'凶', desc:'空劫夹命，主破财不顺' });
    }
  }

  {
    const leftIdx = (mingIdx - 1 + 12) % 12;
    const rightIdx = (mingIdx + 1) % 12;
    const lStars = getStars(astrolabe.palaces[leftIdx]);
    const rStars = getStars(astrolabe.palaces[rightIdx]);
    const hasYangTuo = (lStars.includes('擎羊') && rStars.includes('陀罗')) ||
                       (lStars.includes('陀罗') && rStars.includes('擎羊'));
    if (hasYangTuo && hasMutagen(ming, '忌')) {
      results.push({ name:'羊陀夹忌格', palace:'命宫', type:'凶', desc:'羊陀夹忌，主多灾' });
    }
  }

  {
    const leftIdx = (mingIdx - 1 + 12) % 12;
    const rightIdx = (mingIdx + 1) % 12;
    const lStars = getStars(astrolabe.palaces[leftIdx]);
    const rStars = getStars(astrolabe.palaces[rightIdx]);
    const hasHuoLing = (lStars.includes('火星') && rStars.includes('铃星')) ||
                       (lStars.includes('铃星') && rStars.includes('火星'));
    if (hasHuoLing) {
      results.push({ name:'火铃夹命格', palace:'命宫', type:'凶', desc:'火铃夹命，主劳碌波折' });
    }
  }

  {
    const sunPalace = astrolabe.palaces.find(p => hasStar(p,'太阳'));
    const moonPalace = astrolabe.palaces.find(p => hasStar(p,'太阴'));
    if (sunPalace && moonPalace &&
        sunPalace.earthlyBranch === '戌' && moonPalace.earthlyBranch === '辰') {
      results.push({ name:'日月反背格', palace:'命宫', type:'凶', desc:'日月失位，主劳碌' });
    }
  }

  if (sanFang.has('天马') && sanFang.has('擎羊')) {
    results.push({ name:'马头带箭格', palace:'命宫', type:'凶', desc:'天马擎羊同会，主奔波劳碌' });
  }

  return results;
}

// 返回：宫位名（如 '命宫'）或 null
// ============================================================
// ============================================================
// [P2-10 已实现] 来因宫
// ------------------------------------------------------------
// 宫干 = 生年天干的那个宫位，即为来因宫。
// 12 宫只对应 10 天干，所以可能出现多个宫匹配。
// 返回数组，全部标出。
// ------------------------------------------------------------
// 输入：astrolabe、生年天干
// 返回：宫位名数组（如 ['命宫','夫妻宫']），或空数组
// ============================================================
function getLaiYinPalace(astrolabe, yearGan) {
  if (!astrolabe || !astrolabe.palaces || !yearGan) return [];
  const result = [];
  (astrolabe.palaces || []).forEach(p => {
    if (p.heavenlyStem === yearGan && p.name) {
      if (!result.includes(p.name)) result.push(p.name);
    }
  });
  return result;
}

// 【区块 08】八字数据收集
// ============================================================
function buildBaziData(ec, gender) {
  const safe = (fn, def) => { try { const v = fn(); return v === undefined || v === null ? def : v; } catch(e) { return def; } };
  const joinArr = (a) => Array.isArray(a) ? a.join('') : (a || '');
  const yearGan  = safe(()=>ec.getYearGan(),  '');
  const yearZhi  = safe(()=>ec.getYearZhi(),  '');
  const monthGan = safe(()=>ec.getMonthGan(), '');
  const monthZhi = safe(()=>ec.getMonthZhi(), '');
  const dayGan   = safe(()=>ec.getDayGan(),   '');
  const dayZhi   = safe(()=>ec.getDayZhi(),   '');
  const timeGan  = safe(()=>ec.getTimeGan(),  '');
  const timeZhi  = safe(()=>ec.getTimeZhi(),  '');
  let daYun = [], yunStart = null;
  try {
    const yun = ec.getYun(gender === '男' ? 1 : 0, 2);
    if(yun) {
      yunStart = {
        year: safe(()=>yun.getStartYear(), 0),
        month: safe(()=>yun.getStartMonth(), 0),
        day: safe(()=>yun.getStartDay(), 0),
        solar: safe(()=>yun.getStartSolar() ? yun.getStartSolar().toYmd() : '', '')
      };
      const raw = safe(()=>yun.getDaYun(), []);
      daYun = (raw || []).slice(0, 9).map(d => ({
        gz: safe(()=>d.getGanZhi(), ''),
        startAge: safe(()=>d.getStartAge(), ''),
        endAge: safe(()=>d.getEndAge(), ''),
        startYear: safe(()=>d.getStartYear(), ''),
        endYear: safe(()=>d.getEndYear(), '')
      }));
    }
  } catch(e) { console.warn('大运计算失败:', e); }
  return {
    pillars: [
      { gan: yearGan,  zhi: yearZhi  },
      { gan: monthGan, zhi: monthZhi },
      { gan: dayGan,   zhi: dayZhi   },
      { gan: timeGan,  zhi: timeZhi  }
    ],
    hides: [
      joinArr(safe(()=>ec.getYearHideGan(),  [])),
      joinArr(safe(()=>ec.getMonthHideGan(), [])),
      joinArr(safe(()=>ec.getDayHideGan(),   [])),
      joinArr(safe(()=>ec.getTimeHideGan(),  []))
    ],
    sgGan: [
      safe(()=>ec.getYearShiShenGan(),  ''),
      safe(()=>ec.getMonthShiShenGan(), ''),
      '日主',
      safe(()=>ec.getTimeShiShenGan(),  '')
    ],
    sgZhi: [
      (safe(()=>ec.getYearShiShenZhi(),  []) || []).join('/'),
      (safe(()=>ec.getMonthShiShenZhi(), []) || []).join('/'),
      (safe(()=>ec.getDayShiShenZhi(),   []) || []).join('/'),
      (safe(()=>ec.getTimeShiShenZhi(),  []) || []).join('/')
    ],
    nayin: [
      safe(()=>ec.getYearNaYin(),  ''),
      safe(()=>ec.getMonthNaYin(), ''),
      safe(()=>ec.getDayNaYin(),   ''),
      safe(()=>ec.getTimeNaYin(),  '')
    ],
    dishi: [
      safe(()=>ec.getYearDiShi(),  ''),
      safe(()=>ec.getMonthDiShi(), ''),
      safe(()=>ec.getDayDiShi(),   ''),
      safe(()=>ec.getTimeDiShi(),  '')
    ],
    xunKong: [
      safe(()=>ec.getYearXunKong(),  ''),
      safe(()=>ec.getMonthXunKong(), ''),
      safe(()=>ec.getDayXunKong(),   ''),
      safe(()=>ec.getTimeXunKong(),  '')
    ],
    taiYuan:  safe(()=>ec.getTaiYuan(),  ''),
    mingGong: safe(()=>ec.getMingGong(), ''),
    shenGong: safe(()=>ec.getShenGong(), ''),
    daYun, yunStart
  };
}

// 【区块 09】十神
// ============================================================
const WX_GAN = { '甲':'木','乙':'木','丙':'火','丁':'火','戊':'土','己':'土','庚':'金','辛':'金','壬':'水','癸':'水' };
function getTenGod(dayGan, otherGan) {
  if(!dayGan || !otherGan) return '';
  const dw = WX_GAN[dayGan], ow = WX_GAN[otherGan];
  const sameYY = (TG.indexOf(dayGan) % 2) === (TG.indexOf(otherGan) % 2);
  if(dw === ow) return sameYY ? '比肩' : '劫财';
  if(WX_SHENG[dw] === ow) return sameYY ? '食神' : '伤官';
  if(WX_KE[dw] === ow) return sameYY ? '偏财' : '正财';
  if(WX_KE[ow] === dw) return sameYY ? '偏官' : '正官';
  if(WX_SHENG[ow] === dw) return sameYY ? '偏印' : '正印';
  return '';
}

// ============================================================
// 【区块 10】辅助函数
// ============================================================
function getTimeIndex(h) {
  if(h === 0) return 0;
  if(h >= 23) return 12;
  return Math.floor((h + 1) / 2);
}
function getFuTou(dg, dz) {
  let gi = TG.indexOf(dg), zi = DZ.indexOf(dz);
  let safe = 0;
  while(gi !== 0 && gi !== 5 && safe < 20) { gi = (gi-1+10)%10; zi = (zi-1+12)%12; safe++; }
  return { gan:TG[gi], zhi:DZ[zi], ganZhi:TG[gi]+DZ[zi] };
}
function getSanYuan(zhi) {
  if(['子','午','卯','酉'].includes(zhi)) return '上元';
  if(['寅','申','巳','亥'].includes(zhi)) return '中元';
  return '下元';
}

function view(v) {
  V = v;
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`.tab[data-v="${v}"]`);
  if(btn) btn.classList.add('active');
  if(!D.zw && !D.qm) return;
  if(v === 'qm') {
    document.getElementById('zwArea').classList.add('hidden');
    document.getElementById('qmArea').classList.remove('hidden');
    renderQM();
  } else {
    document.getElementById('qmArea').classList.add('hidden');
    document.getElementById('zwArea').classList.remove('hidden');
    renderZW(v === 'mix');
  }
}
function render() { view(V); }

// ============================================================
// 【区块 13】紫微 4x4 渲染
// ============================================================
const GRID = [
  ['巳','午','未','申'],
  ['辰',null,null,'酉'],
  ['卯',null,null,'戌'],
  ['寅','丑','子','亥']
];
const BR2PAL = { '子':1, '丑':8, '寅':8, '卯':3, '辰':4, '巳':4, '午':9, '未':2, '申':2, '酉':7, '戌':6, '亥':6 };

function renderZW(showQimen) {
  const az = D.zw;
  if(!az) { document.getElementById('zwArea').innerHTML = '<div class="hint">无紫微数据</div>'; return; }
  const palaceByBranch = {};
  (az.palaces || []).forEach(p => { const br = p.earthlyBranch; if(br) palaceByBranch[br] = p; });
  let html = `<div style="text-align:center;color:#c4a35a;margin-bottom:6px;font-size:12px;">
    ${az.solarDate || ''} ${az.time || ''} · ${D.gender} · 五行局 ${az.fiveElementsClass || ''}<br>
    命主 ${az.soul || ''} · 身主 ${az.body || ''}
  </div>`;
  html += '<table>';
  for(let r=0; r<4; r++) {
    html += '<tr>';
    for(let c=0; c<4; c++) {
      const br = GRID[r][c];
      if(br === null) {
        if(r===1 && c===1) html += `<td class="center">${centerCell(1)}</td>`;
        else if(r===1 && c===2) html += `<td class="center">${centerCell(2)}</td>`;
        else if(r===2 && c===1) html += `<td class="center">${centerCell(3)}</td>`;
        else if(r===2 && c===2) html += `<td class="center">${centerCell(4)}</td>`;
        continue;
      }
      const p = palaceByBranch[br];
      if(!p) { html += `<td>${br}</td>`; continue; }
      html += `<td>${palaceCell(p, br, showQimen)}</td>`;
    }
    html += '</tr>';
  }
  html += '</table>';
  document.getElementById('zwArea').innerHTML = html;
}

function palaceCell(p, br, showQimen) {
  const isTianShang = D.shangShi && p.name === D.shangShi.tianShangPalace;
  const isTianShi   = D.shangShi && p.name === D.shangShi.tianShiPalace;
  let s = `<div class="head">${p.name || ''}·${br}宫${p.isBodyPalace ? ' <span style="color:#ff8c42;font-size:9px;">【身】</span>' : ''}</div>`;

  // ============================================================
  // [插槽 P2-10] 来因宫标记
  // ============================================================
  if (D.laiYinPalace && Array.isArray(D.laiYinPalace) && D.laiYinPalace.includes(p.name)) {
    s += '<span class="laiYin">【来因】</span> ';
  }

  const all = [...(p.majorStars||[]), ...(p.minorStars||[]), ...(p.adjectiveStars||[])];
  if(!all.length) {
    s += '<span style="color:#555">无主星</span>';
  } else {
    all.forEach(st => {
      let cls = '';
      if(st.mutagen === '禄') cls='lu';
      else if(st.mutagen === '权') cls='quan';
      else if(st.mutagen === '科') cls='ke';
      else if(st.mutagen === '忌') cls='ji';
      const b = st.brightness ? '['+st.brightness+']' : '';
      const m = st.mutagen ? `·${st.mutagen}` : '';
      s += `<span class="${cls}">${st.name}${b}${m}</span> `;
    });
  }

  // ============================================================
  // [插槽 P0-1] 大限/流年四化覆盖（在星曜后显示动态四化标记）
  // ============================================================
  if (D.horoscope) {
    const dynTags = renderHoroscopeStars(p, br);
    if (dynTags) s += `<div class="ss" style="color:#ffd54f;">${dynTags}</div>`;
  }

  // ============================================================
  // [插槽 P0-3] 自化检测显示
  // ============================================================
  if (D.ziHuaMap && D.ziHuaMap[p.name]) {
    const zh = D.ziHuaMap[p.name];
    const parts = [];
    ['禄','权','科','忌'].forEach(k => {
      if (zh[k] && zh[k].length) parts.push(`自化${k}`);
    });
    if (parts.length) s += `<div class="ss"><span class="ziHua">${parts.join(' ')}</span></div>`;
  }

  // ============================================================
  // [插槽 P1-4] 格局显示
  // ============================================================
  if (D.ziweiPatterns && D.ziweiPatterns.length) {
    const myPatterns = D.ziweiPatterns.filter(x => x.palace === p.name);
    if (myPatterns.length) {
      s += `<div class="ss">${myPatterns.map(x => `<span class="pattern">${x.name}</span>`).join(' ')}</div>`;
    }
  }

  const ss = [];
  if (p.changsheng12) ss.push(`长生:${p.changsheng12}`);
  if (p.boshi12)      ss.push(`博士:${p.boshi12}`);
  if (p.jiangqian12)  ss.push(`将前:${p.jiangqian12}`);
  if (p.suiqian12)    ss.push(`岁前:${p.suiqian12}`);
  if (isTianShang)    ss.push('<span class="shang">天伤</span>');
  if (isTianShi)      ss.push('<span class="shang">天使</span>');
  if (ss.length) s += `<div class="ss">${ss.join('　')}</div>`;

  const xk = []; if (D.yinYangKong) {
    if (D.yinYangKong.yangKong.includes(br)) xk.push('<span class="zhengkong">阳空</span>');
    if (D.yinYangKong.yinKong.includes(br))    xk.push('<span class="fukong">阴空</span>');
  }
  if (D.jieKong) {
    if (D.jieKong.zhengJie === br) xk.push('<span class="jie">正截</span>');
    if (D.jieKong.fuJie === br)    xk.push('<span class="jie">副截</span>');
  }
  if (xk.length) s += `<div class="ss">${xk.join(' ')}</div>`;

  const dec = (p.decadal && p.decadal.range) ? `大限${p.decadal.range[0]}-${p.decadal.range[1]}` : '';
  const ages = (p.ages && p.ages.length) ? `小限${p.ages.join(',')}` : '';
  if(dec || ages) s += `<div style="color:#666;margin-top:3px;font-size:10px;">${dec}<br>${ages}</div>`;

  if(showQimen && D.qm) s += qimenOverlay(br);
  return s;
}

// ============================================================
// ============================================================
// [P0-1 本地版] 大限/流年四化 + 流耀 的星曜渲染
// ------------------------------------------------------------
// 从 D.horoscope 中提取：
//   1. 大限四化：蓝色  #4d9eff
//   2. 流年四化：红色  #ff6b6b
//   3. 流耀：橙色  #ff8c42
// ============================================================
function renderHoroscopeStars(p, br) {
  const h = D.horoscope;
  if (!h) return '';

  const tags = [];
  const allStars = [...(p.majorStars||[]), ...(p.minorStars||[]), ...(p.adjectiveStars||[])];
  const starNames = allStars.map(s => s.name);

  // ---- 1. 大限四化 ----
  if (h.decadal && h.decadal.siHua) {
    const d = h.decadal.siHua;
    ['禄','权','科','忌'].forEach(type => {
      const star = d[type];
      if (star && starNames.includes(star)) {
        tags.push(`<span style="color:#4d9eff;font-size:9px;">限${type}</span>`);
      }
    });
  }

  // ---- 2. 流年四化 ----
  if (h.yearly && h.yearly.siHua) {
    const y = h.yearly.siHua;
    ['禄','权','科','忌'].forEach(type => {
      const star = y[type];
      if (star && starNames.includes(star)) {
        tags.push(`<span style="color:#ff6b6b;font-size:9px;">年${type}</span>`);
      }
    });
  }

  // ---- 3. 流耀（按地支判定，因为流耀是落在具体地支宫） ----
  if (h.liuyao) {
    Object.entries(h.liuyao).forEach(([name, zhi]) => {
      if (zhi === br) {
        tags.push(`<span style="color:#ff8c42;font-size:9px;">${name}</span>`);
      }
    });
  }

  return tags.length ? tags.join(' ') : '';
}

function qimenOverlay(branch) {
  const qm = D.qm;
  const pal = BR2PAL[branch];
  if(!pal) return '';
  const god = qm.shen[pal] || '';
  const star = qm.tStar[pal] || '';
  const stemArr = qm.tStemMap[pal] || [];
  const door = qm.doors[pal] || '';
  const dp = qm.diPan[pal] || '';
  const kong = qm.kongPal.includes(pal);
  const ma = qm.maPal === pal;
  let s = '<div class="qm">';
  s += `<span class="god">${god}</span> `;
  if(kong) s += '<span class="kong">空</span> ';
  if(ma) s += '<span class="ma">马</span> ';
  if(qm.yong[pal]) s += `<span class="yong">${qm.yong[pal].trim()}</span>`;
  s += '<br>';
  s += `<span class="star">${star}</span> `;
  if(stemArr.length) s += `<span class="stem">${stemArr.join('/')}</span>`;
  s += '<br>';
  s += `<span class="door">${door}</span> <span class="stem">${dp}</span>`;

  // 十干克应
  if (qm.menKY && qm.menKY[pal]) {
  qm.menKY[pal].forEach(k => {
    const cls = k.type === '吉' ? 'jiPattern' : (k.type === '凶' ? 'xiongPattern' : '');
    s += `<br><span class="${cls}">${k.name}</span>`;
  });
}
if (qm.shiganKY && qm.shiganKY[pal]) {
    qm.shiganKY[pal].forEach(k => {
      const cls = k.type === '吉' ? 'jiPattern' : (k.type === '凶' ? 'xiongPattern' : '');
      s += `<br><span class="${cls}">${k.name}</span>`;
    });
  }

  // 墓刑迫
  const tags = [];
  if (qm.muMap[pal])   qm.muMap[pal].forEach(t => tags.push(`<span class="muTag">墓${t}</span>`));
  if (qm.xingMap[pal]) qm.xingMap[pal].forEach(t => tags.push(`<span class="xingTag">刑${t}</span>`));
  if (qm.poMap[pal])   qm.poMap[pal].forEach(t => tags.push(`<span class="poTag">${t}</span>`));
  if (tags.length) s += '<br>' + tags.join(' ');

  // [插槽 P1-6] 暗干显示
  if (qm.anGanMap && qm.anGanMap.menAnGan && qm.anGanMap.menAnGan[pal]) {
    const menAG = qm.anGanMap.menAnGan && qm.anGanMap.menAnGan[pal];
const gongAG = qm.anGanMap.gongAnGan && qm.anGanMap.gongAnGan[pal];
const ags = [];
if (menAG)  ags.push(`门暗:${menAG}`);
if (gongAG) ags.push(`宫暗:${gongAG}`);
if (ags.length) s += `<br><span class="anGan">${ags.join(' ')}</span>`;
  }

  // [插槽 P2-7] 五不遇时（只在中宫或盘头显示，此处不重复）
  // [插槽 P2-8] 伏吟反吟
  // [插槽 P2-9] 三奇得使
  // [插槽 P3-11] 九遁
  // [插槽 P3-12] 三诈五假
  // 上述几项的显示都在 renderQM 里统一处理

  s += '</div>';
  return s;
}

// ============================================================
// 【区块 14】中宫四格
// ============================================================
function centerCell(n) {
  if(n === 1) return `<div style="color:#c4a35a;font-size:11px;">紫薇斗数</div>
    <div style="font-size:10px;color:#aaa;margin-top:4px;">
      命主：${D.zw.soul || ''}<br>
      身主：${D.zw.body || ''}<br>
      五行局：${D.zw.fiveElementsClass || ''}<br>
      ${D.zw.time || ''}
    </div>`;

  if(n === 2) {
    const B = D.bazi;
    if(!B || !B.pillars) {
      return `<div style="color:#c4a35a;font-size:11px;border-bottom:1px dashed #333;padding-bottom:2px;margin-bottom:3px;">四柱八字</div>
        <div style="font-size:10px;color:#aaa;line-height:1.6;">
        ${(D.sizhu || '--').split(' ').join('<br>')}
        </div>`;
    }
    const rows = ['年','月','日','时'];
    let s = `<div style="color:#c4a35a;font-size:11px;border-bottom:1px dashed #333;padding-bottom:2px;margin-bottom:3px;">四柱八字</div>`;
    s += `<div style="font-size:9px;line-height:1.45;">`;
    for(let i = 0; i < 4; i++) {
      const p = B.pillars[i] || { gan:'', zhi:'' };
      const sg = (B.sgGan && B.sgGan[i]) || '';
      const hide = (B.hides && B.hides[i]) || '';
      const ny = (B.nayin && B.nayin[i]) || '';
      const xk = (B.xunKong && B.xunKong[i]) || '';
      s += `<div style="margin-bottom:4px;border-bottom:1px dotted #2a2a30;padding-bottom:2px;">`;
      s += `<span style="color:#c4a35a;">${rows[i]}</span> `;
      s += `<span style="color:#ff6b6b;font-size:13px;font-weight:bold;">${p.gan}</span>`;
      s += `<span style="color:#4d9eff;font-size:13px;font-weight:bold;">${p.zhi}</span>`;
      s += ` <span style="color:#9b8ec4;">${sg}</span>`;
      s += `<br><span style="color:#888;">藏</span> <span style="color:#bbb;">${hide || '—'}</span>`;
      s += `<br><span style="color:#7eb8da;">${ny}</span> <span style="color:#ff8c42;">旬空${xk}</span>`;
      s += `</div>`;
    }
    s += `<div style="color:#666;font-size:9px;margin-top:3px;">`;
    s += `胎元 ${B.taiYuan || '--'} · 命宫 ${B.mingGong || '--'}<br>`;
    s += `身宫 ${B.shenGong || '--'}`;
    s += `</div></div>`;
    return s;
  }

  if(n === 3) return `<div style="color:#c4a35a;font-size:11px;">图例</div>
    <div style="font-size:10px;margin-top:4px;line-height:1.7;">
      <span class="lu">禄</span> <span class="quan">权</span> <span class="ke">科</span> <span class="ji">忌</span><br>
      <span class="god">八神</span> <span class="star">九星</span><br>
      <span class="door">八门</span> <span class="stem">地盘</span><br>
      <span class="kong">空</span> <span class="ma">马</span> <span class="yong">用神</span><br>
      <span class="zhengkong">正空</span> <span class="fukong">副空</span><br>
      <span class="jie">正/副截</span> <span class="shang">天伤/天使</span><br>
      <span class="jiPattern">吉格</span> <span class="xiongPattern">凶格</span><br>
      <span class="muTag">墓</span> <span class="xingTag">刑</span> <span class="poTag">迫</span><br>
      <span class="anGan">暗干</span> <span class="ziHua">自化</span><br>
      <span class="laiYin">来因宫</span> <span class="pattern">格局</span>
    </div>`;

  if(n === 4) return `<div style="color:#c4a35a;font-size:11px;">奇门</div>
    <div style="font-size:10px;color:#aaa;margin-top:4px;line-height:1.7;">
      <span style="color:#e74c3c;">${OPT.panType === 'fei' ? '飞盘·干跟星' : '转盘'}</span> · ${{chaibu:'拆补法',zhirun:'置闰法（近似）',maoshan:'茅山法（实验）'}[OPT.dingju] || OPT.dingju}<br>
${D.qm ? D.qm.juStr : ''}<br>
      ${D.qm ? D.qm.jqName + '·' + D.qm.sanyuan : ''}<br>
      值符 ${D.qm ? D.qm.zhiFu : ''}<br>
      值使 ${D.qm ? D.qm.zhiShi : ''}<br>
      旬空 ${D.qm ? D.qm.xunKong : ''}<br>
      驿马 ${D.qm ? D.qm.yima : ''}
    </div>`;

  return '';
}

// ============================================================
// 【区块 15】奇门 3x3 独立盘
// ============================================================
function renderQM() {
  const qm = D.qm;
  if(!qm) { document.getElementById('qmArea').innerHTML = '<div class="hint">无奇门数据</div>'; return; }
  const order = [[4,9,2],[3,5,7],[8,1,6]];
  let html = `<div style="text-align:center;color:#c4a35a;margin-bottom:6px;font-size:12px;">
    ${D.sizhu} · ${qm.juStr} · ${qm.jqName}·${qm.sanyuan}<br>
    值符: ${qm.zhiFu} · 值使: ${qm.zhiShi} · 旬首: ${qm.xunShou}<br>
    <span style="color:#888;font-size:10px;">日干 ${qm.dayGan} 为求测人 · 时干 ${D.lifa.hourPillar[0]} 为事体</span><br>
    <span style="color:#888;font-size:10px;">月令：${qm.yueLing} · 时旬空：${qm.xunKong} · 驿马：${qm.yima}</span>
  </div>`;

  // ============================================================
  // [插槽 P2-7] 五不遇时提示
  // ============================================================
  if (qm.wuBuYu) {
    html += '<div style="text-align:center;color:#ff4d4d;font-weight:bold;margin-bottom:4px;">⚠ 五不遇时 · 百事不顺</div>';
  }

  // ============================================================
  // [插槽 P2-8] 伏吟反吟提示
  // ============================================================
  if (qm.fuyinFanyin) {
    const ff = qm.fuyinFanyin;
    const ffTags = [];
    if (ff.starFu && ff.starFu.length) ffTags.push(`星伏吟：${ff.starFu.join('、')}宫`);
    if (ff.doorFu && ff.doorFu.length) ffTags.push(`门伏吟：${ff.doorFu.join('、')}宫`);
    if (ff.starFan && ff.starFan.length) ffTags.push(`星反吟：${ff.starFan.join('、')}宫`);
    if (ff.doorFan && ff.doorFan.length) ffTags.push(`门反吟：${ff.doorFan.join('、')}宫`);
    if (ffTags.length) html += `<div style="text-align:center;color:#ffab40;font-size:10px;margin-bottom:4px;">${ffTags.join(' · ')}</div>`;
  }

  // ============================================================
  // [插槽 P2-9] 三奇得使 / 玉女守门 / 三奇升殿提示
  // ============================================================
  if (qm.sanQiGe) {
    const sg = qm.sanQiGe;
    const sgTags = [];
    if (sg.deShi && sg.deShi.length) sgTags.push(`三奇得使：${sg.deShi.join('、')}宫`);
    if (sg.yuNv && sg.yuNv.length) sgTags.push(`玉女守门：${sg.yuNv.join('、')}宫`);
    if (sg.shengDian && sg.shengDian.length) sgTags.push(`三奇升殿：${sg.shengDian.join('、')}宫`);
    if (sgTags.length) html += `<div style="text-align:center;color:#4caf50;font-size:10px;margin-bottom:4px;">${sgTags.join(' · ')}</div>`;
  }

  // ============================================================
  // [插槽 P3-11] 九遁提示
  // ============================================================
  if (qm.jiuDun && Object.keys(qm.jiuDun).length) {
    const jdTags = Object.entries(qm.jiuDun).map(([name, pals]) => `${name}：${pals.join('、')}宫`);
    html += `<div style="text-align:center;color:#4caf50;font-size:10px;margin-bottom:4px;">${jdTags.join(' · ')}</div>`;
  }

  // ============================================================
  // [插槽 P3-12] 三诈五假提示
  // ============================================================
  if (qm.sanZhaWuJia && Object.keys(qm.sanZhaWuJia).length) {
    const szTags = Object.entries(qm.sanZhaWuJia).map(([name, pals]) => `${name}：${pals.join('、')}宫`);
    html += `<div style="text-align:center;color:#4caf50;font-size:10px;margin-bottom:4px;">${szTags.join(' · ')}</div>`;
  }

  html += '<table>';
  for(let r=0;r<3;r++){
    html += '<tr>';
    for(let c=0;c<3;c++){
      const p = order[r][c];
      html += `<td class="${p===5?'center':''}">${qimenCell(p)}</td>`;
    }
    html += '</tr>';
  }
  html += '</table>';
  document.getElementById('qmArea').innerHTML = html;
}

function qimenCell(p) {
  const qm = D.qm;
  const god = qm.shen[p] || '';
  const star = qm.tStar[p] || '';
  const stemArr = qm.tStemMap[p] || [];
  const door = qm.doors[p] || '';
  const dp = qm.diPan[p] || '';
  const kong = qm.kongPal.includes(p);
  const ma = qm.maPal === p;
  const gongName = {1:'坎一',2:'坤二',3:'震三',4:'巽四',5:'中五',6:'乾六',7:'兑七',8:'艮八',9:'离九'}[p];

  let s = '';
  s += `<span class="god">${god}</span> `;
  if(kong) s += '<span class="kong">空</span> ';
  if(ma) s += '<span class="ma">马</span>';
  if(qm.yong[p]) s += ` <span class="yong">${qm.yong[p].trim()}</span>`;
  s += '<br>';

  s += `<span class="star">${star}</span> `;
  if (qm.xingWang[p]) {
    const ws = qm.xingWang[p].match(/\((.+?)\)/);
    if (ws) s += `<span class="wang">${ws[1]}</span> `;
  }
  if(stemArr.length) s += `<span class="stem">${stemArr.join('/')}</span>`;
  s += '<br>';

  s += `<span class="door">${door}</span> `;
  if (qm.menWang[p]) {
    const ws = qm.menWang[p].match(/\((.+?)\)/);
    if (ws) s += `<span class="wang">${ws[1]}</span> `;
  }
  s += `<span class="stem">${dp}</span>`;

  if (qm.menKY && qm.menKY[p]) {
  qm.menKY[p].forEach(k => {
    const cls = k.type === '吉' ? 'jiPattern' : (k.type === '凶' ? 'xiongPattern' : '');
    s += `<br><span class="${cls}">${k.name}</span>`;
  });
}
if (qm.shiganKY && qm.shiganKY[p]) {
    qm.shiganKY[p].forEach(k => {
      const cls = k.type === '吉' ? 'jiPattern' : (k.type === '凶' ? 'xiongPattern' : '');
      s += `<br><span class="${cls}">${k.name}</span>`;
    });
  }

  const tags = [];
  if (qm.muMap[p])   qm.muMap[p].forEach(t => tags.push(`<span class="muTag">墓${t}</span>`));
  if (qm.xingMap[p]) qm.xingMap[p].forEach(t => tags.push(`<span class="xingTag">刑${t}</span>`));
  if (qm.poMap[p])   qm.poMap[p].forEach(t => tags.push(`<span class="poTag">${t}</span>`));
  if (tags.length) s += '<br>' + tags.join(' ');

  // [插槽 P1-6] 暗干显示
  if (qm.anGanMap && qm.anGanMap.menAnGan && qm.anGanMap.menAnGan[p]) {
    const menAG = qm.anGanMap.menAnGan && qm.anGanMap.menAnGan[p];
const gongAG = qm.anGanMap.gongAnGan && qm.anGanMap.gongAnGan[p];
const ags = [];
if (menAG)  ags.push(`门暗:${menAG}`);
if (gongAG) ags.push(`宫暗:${gongAG}`);
if (ags.length) s += `<br><span class="anGan">${ags.join(' ')}</span>`;
  }

  if (qm.shenKY && qm.shenKY[p]) {
    s += `<br><span style="color:#9b8ec4;font-size:9px;">${qm.shenKY[p]}</span>`;
  }

  s += `<div style="color:#666;font-size:10px;margin-top:3px;border-top:1px solid #333;padding-top:2px;">${gongName}宫</div>`;
  return s;
}
