<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>紫微 & 奇门 双盘</title>

<!-- ==================== 依赖库 CDN ==================== -->
<script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.js"></script>
<script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.js"></script>

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; background:#0d0d0f; color:#ccc; padding:10px; font-size:12px; }
  h1 { text-align:center; color:#c4a35a; font-size:16px; margin-bottom:10px; letter-spacing:2px; }

  .box { background:#1a1a1e; border:1px solid #2a2a30; border-radius:6px; padding:10px; margin-bottom:10px; }
  .row { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px; align-items:center; }

  button.main { background:#c4a35a; color:#111; font-weight:bold; border:none; width:100%; padding:10px; cursor:pointer; }
  button.tab { background:#2a2a30; color:#aaa; border:none; cursor:pointer; padding:6px 12px; border-radius:4px; font-size:12px; margin:0 2px; }
  button.tab.active { background:#c4a35a; color:#111; font-weight:bold; }
  button.loc { background:#4d9eff; color:#fff; border:none; cursor:pointer; padding:6px 10px; border-radius:4px; font-size:11px; }

  td { border:1px solid #2a2a30; vertical-align:top; padding:4px; font-size:11px; line-height:1.5; word-break:break-all; }
  td.center { background:#151518; border-color:#c4a35a; }
  td .head { color:#c4a35a; font-weight:bold; border-bottom:1px dashed #333; padding-bottom:2px; margin-bottom:3px; font-size:11px; }

  .lu { color:#7b68ee; font-weight:bold; }
  .quan { color:#ff8c42; font-weight:bold; }
  .ke { color:#4d9eff; font-weight:bold; }
  .ji { color:#ff4d4d; font-weight:bold; }
  .god { color:#9b8ec4; }

  .door { color:#d4a56a; }

  .kong { color:#ef5350; font-weight:bold; }
  .ma { color:#2196f3; font-weight:bold; }

  .hidden { display:none; }
  .hint { color:#888; text-align:center; padding:20px; font-size:12px; }

  .ok { color:#6ec06e; padding:4px 8px; font-size:11px; }
  .small { font-size:10px; color:#666; text-align:center; margin-top:4px; }
</style>
</head>
<body>
<h1>紫微斗数 &amp; 奇门遁甲 双盘</h1>

<div class="box" id="envCheck"><div class="hint">检测依赖库中...</div></div>

<div class="box">
  <div class="row">
    <input type="date" id="d" style="flex:2;">
    <input type="time" id="t" style="flex:2;">
    <button onclick="setNow()">当前</button>
  </div>
  <div class="row">
    <label><input type="radio" name="g" value="男" checked>男</label>
    <label><input type="radio" name="g" value="女">女</label>
    <label><input type="checkbox" id="tst"checked > 真太阳时</label>
  </div>

  <!-- 地名 → 打开查询页 -->
  <div class="row">
    <input type="text" id="placeInput" placeholder="输入地名，如：北京市朝阳区" style="flex:2;" value="北京市">
    <button class="loc" onclick="openMapQuery()">打开查询页</button>
  </div>
  <div class="row">
    <input type="number" id="lng" value="116.4074" step="0.0001" style="flex:1;" placeholder="经度">
    <input type="number" id="lat" value="39.9042" step="0.0001" style="flex:1;" placeholder="纬度">
  </div>
  <div class="small" id="locStatus">
    点「打开查询页」→ 跳转到 365-tools.cn/city-level → 选省市区即可看到经纬度
  </div>

  <button class="main" onclick="calc()" style="margin-top:10px;">开始双盘推演</button>
</div>

<div class="box" style="text-align:center;">
  <button class="tab active" data-v="mix" onclick="view('mix')">紫微叠奇门</button>
  <button class="tab" data-v="zw" onclick="view('zw')">纯紫微</button>
  <button class="tab" data-v="qm" onclick="view('qm')">纯奇门</button>
</div>

<div class="box" id="lifaBox" style="display:none;"></div>
<div class="box" id="zwArea"><div class="hint">点击上方按钮开始推演</div></div>
<div class="box hidden" id="qmArea"><div class="hint">点击上方按钮开始推演</div></div>

<script>
// ============================================================
// 【区块 01】环境检测
// ============================================================
window.addEventListener('load', function() {
  const hasLunar = typeof Solar !== 'undefined';
  const hasSun = typeof SunCalc !== 'undefined';
  const hasIztro = typeof iztro !== 'undefined' && iztro && iztro.astro;
  let html = '';
  html += hasLunar ? '<span class="ok">✓ lunar</span> ' : '<span class="err">✗ lunar</span> ';
  html += hasSun ? '<span class="ok">✓ suncalc</span> ' : '<span class="err">✗ suncalc</span> ';
  html += hasIztro ? '<span class="ok">✓ iztro</span>' : '<span class="err">✗ iztro</span>';
  document.getElementById('envCheck').innerHTML = html;
});

// ============================================================
// 【区块 02】全局状态
// ============================================================
let D = { zw:null, qm:null, sizhu:'', gender:'男', lifa:null, bazi:null };
let V = 'mix';

function setNow() {
  const n = new Date();
  document.getElementById('d').value = n.getFullYear() + '-' +
    String(n.getMonth()+1).padStart(2,'0') + '-' +
    String(n.getDate()).padStart(2,'0');
  document.getElementById('t').value =
    String(n.getHours()).padStart(2,'0') + ':' +
    String(n.getMinutes()).padStart(2,'0');
}
setNow();

// ============================================================
// 【区块 02.5】地名 → 打开 365-tools 城市查询页（新标签）
// ============================================================
function openMapQuery() {
  const place = document.getElementById('placeInput').value.trim();
  const status = document.getElementById('locStatus');

  // 复制地名到剪贴板，方便直接粘贴
  if (place && navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(place).catch(() => {});
  }

  // 打开 365-tools 的城市查询页
  const url = 'https://365-tools.cn/city-level/';
  window.open(url, '_blank');

  if (place) {
    status.textContent = `已打开查询页，地名已复制：${place}（在新页面选省市区即可看经纬度）`;
  } else {
    status.textContent = '已打开查询页，选省市区即可看经纬度';
  }
}

// ============================================================
// 【区块 03】奇门遁甲计算
// ============================================================
const JU = {
  '冬至':['阳遁一局','阳遁七局','阳遁四局'],'小寒':['阳遁二局','阳遁八局','阳遁五局'],'大寒':['阳遁三局','阳遁九局','阳遁六局'],
  '立春':['阳遁八局','阳遁五局','阳遁二局'],'雨水':['阳遁九局','阳遁六局','阳遁三局'],'惊蛰':['阳遁一局','阳遁七局','阳遁四局'],
  '春分':['阳遁三局','阳遁九局','阳遁六局'],'清明':['阳遁四局','阳遁一局','阳遁七局'],'谷雨':['阳遁五局','阳遁二局','阳遁八局'],
  '立夏':['阳遁四局','阳遁一局','阳遁七局'],'小满':['阳遁五局','阳遁二局','阳遁八局'],'芒种':['阳遁六局','阳遁三局','阳遁九局'],
  '夏至':['阴遁九局','阴遁三局','阴遁六局'],'小暑':['阴遁八局','阴遁二局','阴遁五局'],'大暑':['阴遁七局','阴遁一局','阴遁四局'],
  '立秋':['阴遁二局','阴遁五局','阴遁八局'],'处暑':['阴遁一局','阴遁四局','阴遁七局'],'白露':['阴遁九局','阴遁三局','阴遁六局'],
  '秋分':['阴遁七局','阴遁一局','阴遁四局'],'寒露':['阴遁六局','阴遁九局','阴遁三局'],'霜降':['阴遁五局','阴遁八局','阴遁二局'],
  '立冬':['阴遁六局','阴遁九局','阴遁三局'],'小雪':['阴遁五局','阴遁八局','阴遁二局'],'大雪':['阴遁四局','阴遁七局','阴遁一局']
};
const TG = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const DZ = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const JN = {'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};

function qDipan(ju, yang) {
  const s = ['戊','己','庚','辛','壬','癸','丁','丙','乙']; const m = {};
  for(let i=1;i<=9;i++) m[i]='';
  for(let i=0;i<9;i++) { let p = yang ? (ju+i-1)%9+1 : (ju-i-1+9)%9+1; if(p<=0)p+=9; m[p]=s[i]; }
  return m;
}
function qPos(m, st) { for(let i=1;i<=9;i++) if(m[i]===st) return i; return 1; }

function qCalc(hg, hz, juStr) {
  const yang = juStr.startsWith('阳');
  const ju = JN[juStr.replace(/[阳阴遁局]/g,'')] || 1;
  const em = qDipan(ju, yang);
  const diff = (DZ.indexOf(hz) - TG.indexOf(hg) + 12) % 12;
  const xMap = {0:'戊',10:'己',8:'庚',6:'辛',4:'壬',2:'癸'};
  const xStem = xMap[diff] || '戊';
  const xLoc = qPos(em, xStem);

  const stars = {1:'天蓬',2:'天芮',3:'天冲',4:'天辅',5:'天禽',6:'天心',7:'天柱',8:'天任',9:'天英'};
  const gates = {1:'休门',2:'死门',3:'伤门',4:'杜门',5:'死门',6:'开门',7:'惊门',8:'生门',9:'景门'};
  const zhiFu = stars[xLoc], zhiShi = gates[xLoc];
  const xName = {'戊':'甲子(戊)','己':'甲戌(己)','庚':'甲申(庚)','辛':'甲午(辛)','壬':'甲辰(壬)','癸':'甲寅(癸)'}[xStem];

  const seqS = ['天蓬','天任','天冲','天辅','天英','天芮','天柱','天心'];
  const seqP = [1,8,3,4,9,2,7,6];
  let lPal = xLoc; let lIs5 = lPal===5; if(lIs5) lPal=2;
  const pMap = {}; [1,8,3,4,9,2,7,6].forEach((p,i)=>pMap[p]=seqS[i]);
  const zfStar = lIs5 ? '天禽' : pMap[lPal];
  let tStem = hg==='甲' ? xStem : hg;
  let tPal = qPos(em, tStem); if(tPal===5) tPal=2;
  const tStar = {}; const tStemMap = {};
  let sIdx = zfStar==='天禽' ? seqS.indexOf('天芮') : seqS.indexOf(zfStar);
  const tIdx = seqP.indexOf(tPal), lIdx = seqP.indexOf(lPal);
  const off = tIdx - lIdx; let trPal = null;
  for(let i=0;i<8;i++){ const cs = seqS[(sIdx+i)%8]; const cp = seqP[(tIdx+i)%8]; tStar[cp]=cs; if(cs==='天芮') trPal=cp; }
  for(let i=0;i<8;i++){ const op = seqP[i]; const np = seqP[(i+off%8+8)%8]; const sc = em[op]; if(op===2){ tStemMap[np]=[sc, em[5]]; } else { if(!tStemMap[np]) tStemMap[np]=[sc]; } }
  if(trPal) tStar[trPal]='天芮/天禽'; tStar[5]=''; tStemMap[5]=[];

  const ring = [1,8,3,4,9,2,7,6]; const dSeq = ['休','生','伤','杜','景','死','惊','开'];
  const gMap = {1:'休',2:'死',3:'伤',4:'杜',5:'死',6:'开',7:'惊',8:'生',9:'景'};
  const xZhiIdx = {'戊':0,'己':10,'庚':8,'辛':6,'壬':4,'癸':2}[xStem];
  let hOff = DZ.indexOf(hz) - xZhiIdx; if(hOff<0) hOff+=12;
  let curL = yang ? (xLoc+hOff-1)%9+1 : (xLoc-hOff-1+9)%9+1; if(curL<=0) curL+=9;
  const dTarget = curL===5 ? 2 : curL;
  const dMap = {}; const dIdx = dSeq.indexOf(gMap[xLoc]); const sPIdx = ring.indexOf(dTarget);
  for(let i=0;i<8;i++) dMap[ring[(sPIdx+i)%8]] = dSeq[(dIdx+i)%8]+'门';
  dMap[5]='';

  const ds = ['值符','螣蛇','太阴','六合','白虎','玄武','九地','九天'];
  const sMap = {}; const sStart = ring.indexOf(tPal);
  for(let i=0;i<8;i++){ const idx = yang ? (sStart+i)%8 : ((sStart-i)%8+8)%8; sMap[ring[idx]] = ds[i]; }
  sMap[5]='';

  const leader = (DZ.indexOf(hz) - TG.indexOf(hg) + 12) % 12;
  const v1 = (leader-2+12)%12, v2 = (leader-1+12)%12;
  const tMap = {8:2,0:2,4:2,2:8,6:8,10:8,5:11,9:11,1:11,11:5,3:5,7:5};
  const mIdx = tMap[DZ.indexOf(hz)];
  const pMapBranch = {0:1,1:8,2:8,3:3,4:4,5:4,6:9,7:2,8:2,9:7,10:6,11:6};
  const kongPal = [...new Set([pMapBranch[v1], pMapBranch[v2]])];
  const maPal = pMapBranch[mIdx];

  return { juStr, yang, diPan:em, tStar, tStemMap, doors:dMap, shen:sMap, kongPal, maPal, zhiFu, zhiShi, xunShou:xName };
}

// ============================================================
// 【区块 04】真太阳时
// ============================================================
function getTrueSolarTime(date, lat, lng) {
  try {
    const times = SunCalc.getTimes(date, lat, lng);
    const solarNoon = times.solarNoon;
    const noonMinutes = solarNoon.getHours()*60 + solarNoon.getMinutes() + solarNoon.getSeconds()/60;
    const noonOffset = noonMinutes - 12*60;
    return new Date(date.getTime() - noonOffset*60*1000);
  } catch(e) {
    const offsetMin = (lng - 120) * 4;
    return new Date(date.getTime() + offsetMin*60*1000);
  }
}

// ============================================================
// 【区块 05】iztro 调用
// ============================================================
function callIztro(dateStr, timeIdx, gender) {
  const astroObj = (typeof iztro !== 'undefined' && iztro && iztro.astro)
    ? iztro.astro : (typeof astro !== 'undefined' ? astro : null);
  if(!astroObj || typeof astroObj.bySolar !== 'function') throw new Error('iztro 未正确加载');
  try { return astroObj.bySolar(dateStr, timeIdx, gender, true, 'zh-CN'); }
  catch(e1) {
    try { return astroObj.bySolar(dateStr, timeIdx, gender, true); }
    catch(e2) { return astroObj.bySolar(dateStr, timeIdx, gender); }
  }
}

// ============================================================
// 【区块 06】主计算入口
// ============================================================
function calc() {
  const errOut = function(msg) {
    document.getElementById('zwArea').innerHTML = '<div class="err">' + msg + '</div>';
    document.getElementById('zwArea').classList.remove('hidden');
  };
  try {
    const dateStr = document.getElementById('d').value;
    const timeStr = document.getElementById('t').value;
    if(!dateStr || !timeStr) { alert('请选择日期时间'); return; }
    const [Y,Mo,Dd] = dateStr.split('-').map(Number);
    const [H,Mi] = timeStr.split(':').map(Number);
    const inputDate = new Date(Y, Mo-1, Dd, H, Mi, 0);
    const useTST = document.getElementById('tst').checked;
    const lng = parseFloat(document.getElementById('lng').value) || 116.4074;
    const lat = parseFloat(document.getElementById('lat').value) || 39.9042;

    let calcDate = inputDate;
    if(useTST) calcDate = getTrueSolarTime(inputDate, lat, lng);
    const cY = calcDate.getFullYear();
    const cM = calcDate.getMonth() + 1;
    const cD = calcDate.getDate();
    const cH = calcDate.getHours();
    const cMi = calcDate.getMinutes();

    const solar = Solar.fromYmdHms(cY, cM, cD, cH, cMi, 0);
    const lunar = solar.getLunar();
    const ec = lunar.getEightChar();
    const yg=ec.getYearGan(), yz=ec.getYearZhi();
    const mg=ec.getMonthGan(), mz=ec.getMonthZhi();
    const dg=ec.getDayGan(), dz=ec.getDayZhi();
    const hg=ec.getTimeGan(), hz=ec.getTimeZhi();
    D.sizhu = `${yg}${yz} ${mg}${mz} ${dg}${dz} ${hg}${hz}`;

    const dayGan = dg;
    const tenGods = {
      year: getTenGod(dayGan, yg),
      month: getTenGod(dayGan, mg),
      day: '日主',
      hour: getTenGod(dayGan, hg)
    };

    let jqName = '冬至', prevJQTime = '', nextJQTime = '';
    try {
      const prevJQ = lunar.getPrevJieQi();
      const nextJQ = lunar.getNextJieQi();
      if(prevJQ) {
        jqName = prevJQ.getName();
        const s = prevJQ.getSolar();
        prevJQTime = `${s.getYear()}-${String(s.getMonth()).padStart(2,'0')}-${String(s.getDay()).padStart(2,'0')} ${String(s.getHour()).padStart(2,'0')}:${String(s.getMinute()).padStart(2,'0')}`;
      }
      if(nextJQ) {
        const s = nextJQ.getSolar();
        nextJQTime = `${s.getYear()}-${String(s.getMonth()).padStart(2,'0')}-${String(s.getDay()).padStart(2,'0')} ${String(s.getHour()).padStart(2,'0')}:${String(s.getMinute()).padStart(2,'0')}`;
      }
    } catch(e) {}

    const fuTou = getFuTou(dg, dz);
    const sanyuan = getSanYuan(fuTou.zhi);
    const syIdx = ['上元','中元','下元'].indexOf(sanyuan);
    let juStr = '阳遁一局';
    if(JU[jqName] && syIdx >= 0) juStr = JU[jqName][syIdx];

    D.qm = qCalc(hg, hz, juStr);
    D.qm.jqName = jqName;
    D.qm.sanyuan = sanyuan;

    const gender = document.querySelector('input[name="g"]:checked').value;
    D.gender = gender;
    const timeIdx = getTimeIndex(cH);
    const calcDateStr = `${cY}-${String(cM).padStart(2,'0')}-${String(cD).padStart(2,'0')}`;
    const astrolabe = callIztro(calcDateStr, timeIdx, gender);
    if(!astrolabe || !astrolabe.palaces) throw new Error('iztro 返回异常');
    D.zw = astrolabe;

    D.lifa = {
      inputTime: `${Y}-${String(Mo).padStart(2,'0')}-${String(Dd).padStart(2,'0')} ${String(H).padStart(2,'0')}:${String(Mi).padStart(2,'0')}`,
      calcTime: `${cY}-${String(cM).padStart(2,'0')}-${String(cD).padStart(2,'0')} ${String(cH).padStart(2,'0')}:${String(cMi).padStart(2,'0')}`,
      useTST, lng, lat,
      lunarDate: lunar.toString(),
      lunarYear: lunar.getYearInGanZhi() + '年',
      lunarMonth: lunar.getMonthInChinese() + '月',
      lunarDay: lunar.getDayInChinese(),
      yearPillar: yg + yz,
      monthPillar: mg + mz,
      dayPillar: dg + dz,
      hourPillar: hg + hz,
      tenGods,
      fuTou: fuTou.ganZhi,
      sanyuan,
      jqName,
      prevJQTime, nextJQTime,
      juStr
    };

    D.bazi = buildBaziData(ec, gender);

    renderLifa();
    render();
  } catch(e) {
    console.error(e);
    errOut('排盘失败：' + (e.message || e));
  }
}

// ============================================================
// 【区块 07】八字数据收集
// ============================================================
function buildBaziData(ec, gender) {
  const safe = (fn, def) => { try { const v = fn(); return v === undefined || v === null ? def : v; } catch(e) { return def; } };
  const joinArr = (a) => Array.isArray(a) ? a.join('') : (a || '');

  const yearGan  = safe(()=>ec.getYearGan(),  '');
  const yearZhi  = safe(()=>ec.getYearZhi(),  '');
  const monthGan = safe(()=>ec.getMonthGan(), '');
  const monthZhi = safe(()=>ec.getMonthZhi(), '');
  const dayGan   = safe(()=>ec.getDayGan(),   '');
  const dayZhi   = safe(()=>ec.getDayZhi(),   '');
  const timeGan  = safe(()=>ec.getTimeGan(),  '');
  const timeZhi  = safe(()=>ec.getTimeZhi(),  '');

  let daYun = [], yunStart = null;
  try {
    const yun = ec.getYun(gender === '男' ? 1 : 0, 2);
    if(yun) {
      yunStart = {
        year: safe(()=>yun.getStartYear(), 0),
        month: safe(()=>yun.getStartMonth(), 0),
        day: safe(()=>yun.getStartDay(), 0),
        solar: safe(()=>yun.getStartSolar() ? yun.getStartSolar().toYmd() : '', '')
      };
      const raw = safe(()=>yun.getDaYun(), []);
      daYun = (raw || []).slice(0, 9).map(d => ({
        gz: safe(()=>d.getGanZhi(), ''),
        startAge: safe(()=>d.getStartAge(), ''),
        endAge: safe(()=>d.getEndAge(), ''),
        startYear: safe(()=>d.getStartYear(), ''),
        endYear: safe(()=>d.getEndYear(), '')
      }));
    }
  } catch(e) { console.warn('大运计算失败:', e); }

  return {
    pillars: [
      { gan: yearGan,  zhi: yearZhi  },
      { gan: monthGan, zhi: monthZhi },
      { gan: dayGan,   zhi: dayZhi   },
      { gan: timeGan,  zhi: timeZhi  }
    ],
    hides: [
      joinArr(safe(()=>ec.getYearHideGan(),  [])),
      joinArr(safe(()=>ec.getMonthHideGan(), [])),
      joinArr(safe(()=>ec.getDayHideGan(),   [])),
      joinArr(safe(()=>ec.getTimeHideGan(),  []))
    ],
    sgGan: [
      safe(()=>ec.getYearShiShenGan(),  ''),
      safe(()=>ec.getMonthShiShenGan(), ''),
      '日主',
      safe(()=>ec.getTimeShiShenGan(),  '')
    ],
    sgZhi: [
      (safe(()=>ec.getYearShiShenZhi(),  []) || []).join('/'),
      (safe(()=>ec.getMonthShiShenZhi(), []) || []).join('/'),
      (safe(()=>ec.getDayShiShenZhi(),   []) || []).join('/'),
      (safe(()=>ec.getTimeShiShenZhi(),  []) || []).join('/')
    ],
    nayin: [
      safe(()=>ec.getYearNaYin(),  ''),
      safe(()=>ec.getMonthNaYin(), ''),
      safe(()=>ec.getDayNaYin(),   ''),
      safe(()=>ec.getTimeNaYin(),  '')
    ],
    dishi: [
      safe(()=>ec.getYearDiShi(),  ''),
      safe(()=>ec.getMonthDiShi(), ''),
      safe(()=>ec.getDayDiShi(),   ''),
      safe(()=>ec.getTimeDiShi(),  '')
    ],
    xunKong: [
      safe(()=>ec.getYearXunKong(),  ''),
      safe(()=>ec.getMonthXunKong(), ''),
      safe(()=>ec.getDayXunKong(),   ''),
      safe(()=>ec.getTimeXunKong(),  '')
    ],
    taiYuan:  safe(()=>ec.getTaiYuan(),  ''),
    mingGong: safe(()=>ec.getMingGong(), ''),
    shenGong: safe(()=>ec.getShenGong(), ''),
    daYun, yunStart
  };
}

// ============================================================
// 【区块 08】十神
// ============================================================
const WX_GAN = { '甲':'木','乙':'木','丙':'火','丁':'火','戊':'土','己':'土','庚':'金','辛':'金','壬':'水','癸':'水' };
const WX_SHENG = { '木':'火','火':'土','土':'金','金':'水','水':'木' };
const WX_KE = { '木':'土','土':'水','水':'火','火':'金','金':'木' };
function getTenGod(dayGan, otherGan) {
  if(!dayGan || !otherGan) return '';
  const dw = WX_GAN[dayGan], ow = WX_GAN[otherGan];
  const sameYY = (TG.indexOf(dayGan) % 2) === (TG.indexOf(otherGan) % 2);
  if(dw === ow) return sameYY ? '比肩' : '劫财';
  if(WX_SHENG[dw] === ow) return sameYY ? '食神' : '伤官';
  if(WX_KE[dw] === ow) return sameYY ? '偏财' : '正财';
  if(WX_KE[ow] === dw) return sameYY ? '偏官' : '正官';
  if(WX_SHENG[ow] === dw) return sameYY ? '偏印' : '正印';
  return '';
}

// ============================================================
// 【区块 09】辅助函数
// ============================================================
function getTimeIndex(h) {
  if(h === 0) return 0;
  if(h >= 23) return 12;
  return Math.floor((h + 1) / 2);
}
function getFuTou(dg, dz) {
  let gi = TG.indexOf(dg), zi = DZ.indexOf(dz);
  let safe = 0;
  while(gi !== 0 && gi !== 5 && safe < 20) { gi = (gi-1+10)%10; zi = (zi-1+12)%12; safe++; }
  return { gan:TG[gi], zhi:DZ[zi], ganZhi:TG[gi]+DZ[zi] };
}
function getSanYuan(zhi) {
  if(['子','午','卯','酉'].includes(zhi)) return '上元';
  if(['寅','申','巳','亥'].includes(zhi)) return '中元';
  return '下元';
}

// ============================================================
// 【区块 11】视图切换
// ============================================================
function view(v) {
  V = v;
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`.tab[data-v="${v}"]`);
  if(btn) btn.classList.add('active');
  if(!D.zw && !D.qm) return;
  if(v === 'qm') {
    document.getElementById('zwArea').classList.add('hidden');
    document.getElementById('qmArea').classList.remove('hidden');
    renderQM();
  } else {
    document.getElementById('qmArea').classList.add('hidden');
    document.getElementById('zwArea').classList.remove('hidden');
    renderZW(v === 'mix');
  }
}
function render() { view(V); }

// ============================================================
// 【区块 12】紫微 4x4 渲染
// ============================================================
const GRID = [
  ['巳','午','未','申'],
  ['辰',null,null,'酉'],
  ['卯',null,null,'戌'],
  ['寅','丑','子','亥']
];
const BR2PAL = { '子':1, '丑':8, '寅':8, '卯':3, '辰':4, '巳':4, '午':9, '未':2, '申':2, '酉':7, '戌':6, '亥':6 };

function renderZW(showQimen) {
  const az = D.zw;
  if(!az) { document.getElementById('zwArea').innerHTML = '<div class="hint">无紫微数据</div>'; return; }
  const palaceByBranch = {};
  (az.palaces || []).forEach(p => { const br = p.earthlyBranch; if(br) palaceByBranch[br] = p; });

  let html = `<div style="text-align:center;color:#c4a35a;margin-bottom:6px;font-size:12px;">
    ${az.solarDate || ''} ${az.time || ''} · ${D.gender} · 五行局 ${az.fiveElementsClass || ''}<br>
    命主 ${az.soul || ''} · 身主 ${az.body || ''}
  </div>`;
  html += '<table>';
  for(let r=0; r<4; r++) {
    html += '<tr>';
    for(let c=0; c<4; c++) {
      const br = GRID[r][c];
      if(br === null) {
        if(r===1 && c===1) html += `<td class="center">${centerCell(1)}</td>`;
        else if(r===1 && c===2) html += `<td class="center">${centerCell(2)}</td>`;
        else if(r===2 && c===1) html += `<td class="center">${centerCell(3)}</td>`;
        else if(r===2 && c===2) html += `<td class="center">${centerCell(4)}</td>`;
        continue;
      }
      const p = palaceByBranch[br];
      if(!p) { html += `<td>${br}</td>`; continue; }
      html += `<td>${palaceCell(p, br, showQimen)}</td>`;
    }
    html += '</tr>';
  }
  html += '</table>';
  document.getElementById('zwArea').innerHTML = html;
}

function palaceCell(p, br, showQimen) {
  let s = `<div class="head">${p.name || ''}·${br}宫</div>`;
  const all = [...(p.majorStars||[]), ...(p.minorStars||[]), ...(p.adjectiveStars||[])];
  if(!all.length) {
    s += '<span style="color:#555">无主星</span>';
  } else {
    all.forEach(st => {
      let cls = '';
      if(st.mutagen === '禄') cls='lu';
      else if(st.mutagen === '权') cls='quan';
      else if(st.mutagen === '科') cls='ke';
      else if(st.mutagen === '忌') cls='ji';
      const b = st.brightness ? '['+st.brightness+']' : '';
      const m = st.mutagen ? `·${st.mutagen}` : '';
      s += `<span class="${cls}">${st.name}${b}${m}</span> `;
    });
  }
  const dec = (p.decadal && p.decadal.range) ? `大限${p.decadal.range[0]}-${p.decadal.range[1]}` : '';
  const ages = (p.ages && p.ages.length) ? `小限${p.ages.join(',')}` : '';
  if(dec || ages) s += `<div style="color:#666;margin-top:3px;font-size:10px;">${dec}<br>${ages}</div>`;
  if(showQimen && D.qm) s += qimenOverlay(br);
  return s;
}

function qimenOverlay(branch) {
  const qm = D.qm;
  const pal = BR2PAL[branch];
  if(!pal) return '';
  const god = qm.shen[pal] || '';
  const star = qm.tStar[pal] || '';
  const stemArr = qm.tStemMap[pal] || [];
  const door = qm.doors[pal] || '';
  const dp = qm.diPan[pal] || '';
  const kong = qm.kongPal.includes(pal);
  const ma = qm.maPal === pal;
  let s = '<div class="qm">';
  s += `<span class="god">${god}</span> `;
  if(kong) s += '<span class="kong">空</span> ';
  if(ma) s += '<span class="ma">马</span> ';
  s += '<br>';
  s += `<span class="star">${star}</span> `;
  if(stemArr.length) s += `<span class="stem">${stemArr.join('/')}</span>`;
  s += '<br>';
  s += `<span class="door">${door}</span> <span class="stem">${dp}</span></div>`;
  return s;
}

// ============================================================
// 【区块 13】中宫四格
// ============================================================
function centerCell(n) {
  if(n === 1) return `<div style="color:#c4a35a;font-size:11px;">紫薇斗数</div>
    <div style="font-size:10px;color:#aaa;margin-top:4px;">
      命主：${D.zw.soul || ''}<br>
      身主：${D.zw.body || ''}<br>
      五行局：${D.zw.fiveElementsClass || ''}<br>
      ${D.zw.time || ''}
    </div>`;

  if(n === 2) {
    const B = D.bazi;
    if(!B || !B.pillars) {
      return `<div style="color:#c4a35a;font-size:11px;border-bottom:1px dashed #333;padding-bottom:2px;margin-bottom:3px;">四柱八字</div>
        <div style="font-size:10px;color:#aaa;line-height:1.6;">
        ${(D.sizhu || '--').split(' ').join('<br>')}
        <div style="color:#666;margin-top:3px;">（D.bazi 未构造）</div>
        </div>`;
    }
    const rows = ['年','月','日','时'];
    let s = `<div style="color:#c4a35a;font-size:11px;border-bottom:1px dashed #333;padding-bottom:2px;margin-bottom:3px;">四柱八字</div>`;
    s += `<div style="font-size:9px;line-height:1.45;">`;
    for(let i = 0; i < 4; i++) {
      const p = B.pillars[i] || { gan:'', zhi:'' };
      const sg = (B.sgGan && B.sgGan[i]) || '';
      const hide = (B.hides && B.hides[i]) || '';
      const ny = (B.nayin && B.nayin[i]) || '';
      const xk = (B.xunKong && B.xunKong[i]) || '';
      s += `<div style="margin-bottom:4px;border-bottom:1px dotted #2a2a30;padding-bottom:2px;">`;
      s += `<span style="color:#c4a35a;">${rows[i]}</span> `;
      s += `<span style="color:#ff6b6b;font-size:13px;font-weight:bold;">${p.gan}</span>`;
      s += `<span style="color:#4d9eff;font-size:13px;font-weight:bold;">${p.zhi}</span>`;
      s += ` <span style="color:#9b8ec4;">${sg}</span>`;
      s += `<br><span style="color:#888;">藏</span> <span style="color:#bbb;">${hide || '—'}</span>`;
      s += `<br><span style="color:#7eb8da;">${ny}</span> <span style="color:#ff8c42;">旬空${xk}</span>`;
      s += `</div>`;
    }
    s += `<div style="color:#666;font-size:9px;margin-top:3px;">`;
    s += `胎元 ${B.taiYuan || '--'} · 命宫 ${B.mingGong || '--'}<br>`;
    s += `身宫 ${B.shenGong || '--'}`;
    s += `</div></div>`;
    return s;
  }

  if(n === 3) return `<div style="color:#c4a35a;font-size:11px;">图例</div>
    <div style="font-size:10px;margin-top:4px;line-height:1.7;">
      <span class="lu">禄</span> <span class="quan">权</span> <span class="ke">科</span> <span class="ji">忌</span><br>
      <span class="god">八神</span> <span class="star">九星</span><br>
      <span class="door">八门</span> <span class="stem">地盘</span>
    </div>`;

  if(n === 4) return `<div style="color:#c4a35a;font-size:11px;">奇门</div>
    <div style="font-size:10px;color:#aaa;margin-top:4px;line-height:1.7;">
      ${D.qm ? D.qm.juStr : ''}<br>
      ${D.qm ? D.qm.jqName + '·' + D.qm.sanyuan : ''}<br>
      值符 ${D.qm ? D.qm.zhiFu : ''}<br>
      值使 ${D.qm ? D.qm.zhiShi : ''}
    </div>`;

  return '';
}

// ============================================================
// 【区块 14】奇门 3x3 独立盘
// ============================================================
function renderQM() {
  const qm = D.qm;
  if(!qm) { document.getElementById('qmArea').innerHTML = '<div class="hint">无奇门数据</div>'; return; }
  const order = [[4,9,2],[3,5,7],[8,1,6]];
  let html = `<div style="text-align:center;color:#c4a35a;margin-bottom:6px;font-size:12px;">
    ${D.sizhu} · ${qm.juStr} · ${qm.jqName}·${qm.sanyuan}<br>
    值符: ${qm.zhiFu} · 值使: ${qm.zhiShi} · 旬首: ${qm.xunShou}
  </div>`;
  html += '<table>';
  for(let r=0;r<3;r++){
    html += '<tr>';
    for(let c=0;c<3;c++){
      const p = order[r][c];
      html += `<td class="${p===5?'center':''}">${qimenCell(p)}</td>`;
    }
    html += '</tr>';
  }
  html += '</table>';
  document.getElementById('qmArea').innerHTML = html;
}

function qimenCell(p) {
  const qm = D.qm;
  const god = qm.shen[p] || '';
  const star = qm.tStar[p] || '';
  const stemArr = qm.tStemMap[p] || [];
  const door = qm.doors[p] || '';
  const dp = qm.diPan[p] || '';
  const kong = qm.kongPal.includes(p);
  const ma = qm.maPal === p;
  const gongName = {1:'坎一',2:'坤二',3:'震三',4:'巽四',5:'中五',6:'乾六',7:'兑七',8:'艮八',9:'离九'}[p];
  let s = '';
  s += `<span class="god">${god}</span> `;
  if(kong) s += '<span class="kong">空</span> ';
  if(ma) s += '<span class="ma">马</span>';
  s += '<br>';
  s += `<span class="star">${star}</span> `;
  if(stemArr.length) s += `<span class="stem">${stemArr.join('/')}</span>`;
  s += '<br>';
  s += `<span class="door">${door}</span> <span class="stem">${dp}</span>`;
  s += `<div style="color:#666;font-size:10px;margin-top:3px;border-top:1px solid #333;padding-top:2px;">${gongName}宫</div>`;
  return s;
}
